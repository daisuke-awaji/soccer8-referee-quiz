<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="description" content="8人制サッカーの審判トレーニング（試作版）。動きを見て判定するクイズ。">
  <title>8人制 審判トレーニング（試作版）</title>
  <style>
/* 8人制 審判クイズ 試作版 — スタイル（スマホ縦を基本、屋外でも見やすい高コントラスト） */
:root {
  --bg: #f4f6f2; --card: #fff; --ink: #1c241c; --muted: #5d6a5d; --line: #dfe5dc;
  --green: #2e7d32; --green-d: #1b5e20; --green-l: #e8f5e9;
  --red: #c62828; --red-l: #fdecea; --amber: #b26a00; --amber-l: #fff4e0;
  --blue-l: #e7f0ff; --yellow: #ffeb3b;
  --radius: 14px; --bar-h: 52px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  font-size: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  line-height: 1.6; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--green-d); }
:focus-visible { outline: 3px solid #1565c0; outline-offset: 2px; }
[hidden] { display: none !important; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
.screen { padding: 0 16px calc(96px + var(--safe-b)); }
.muted { color: var(--muted); }
.sec { font-size: 1rem; margin: 22px 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }

/* ---------- ボタン */
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; min-height: 48px; }
.btn.primary { background: var(--green); color: #fff; box-shadow: 0 2px 0 var(--green-d); }
.btn.primary:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.btn.primary:disabled { background: #fff; box-shadow: none; color: #4a574a; border: 2px dashed #9fb09f; }
.btn.ghost { background: #fff; border: 1.5px solid var(--line); }
.btn.big { width: 100%; font-size: 1.08rem; min-height: var(--bar-h); }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: .88rem; }
.icon-btn { background: none; border: 0; width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; line-height: 1; display: grid; place-items: center; }
.icon-btn:active { background: rgba(0,0,0,.06); }
.link-btn { background: none; border: 0; padding: 6px 0; color: var(--green-d); font-weight: 700; }
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px 16px calc(10px + var(--safe-b));
  background: linear-gradient(to top, var(--bg) 70%, rgba(244,246,242,0));
  max-width: 560px; margin: 0 auto;
}

/* ---------- チップ */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.chip { display: inline-block; font-size: .78rem; padding: 3px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip-cat { background: var(--green-l); border-color: #c8e6c9; color: var(--green-d); font-weight: 700; }
.chip-new { background: var(--blue-l); border-color: #c5d9ff; color: #0d47a1; font-weight: 700; }
.chip-warn { background: var(--amber-l); border-color: #ffe0b2; color: var(--amber); font-weight: 700; }
.chip-lv { margin-left: auto; }

/* ---------- ホーム */
.home .hero { display: flex; gap: 16px; align-items: center; padding: 28px 0 10px; }
.home .logo { width: 64px; flex: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.18)); }
.home h1 { font-size: 1.55rem; line-height: 1.25; margin: 0 0 6px; letter-spacing: .02em; }
.home .lead { margin: 0; color: var(--muted); font-size: .92rem; }
.levels { display: grid; gap: 10px; }
.level-card {
  text-align: left; background: #fff; border: 2px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
  transition: border-color .15s, box-shadow .15s;
}
.level-card { position: relative; }
.level-card.on { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,125,50,.15); background: #fbfefb; }
.level-card::after { content: ""; position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c5cdc5; }
.level-card.on::after { content: "✓"; background: var(--green); border-color: var(--green); color: #fff; font-weight: 900; font-size: .8rem; display: grid; place-items: center; }
.lv-badge { grid-row: span 2; font-weight: 800; font-size: 1.05rem; width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.lv-beginner { background: #43a047; }
.lv-grade4 { background: #1e63d6; }
.lv-who { font-weight: 700; }
.lv-points { margin: 0; padding-left: 1.1em; color: var(--muted); font-size: .86rem; }
.resume { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.howto ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 8px; }
.howto li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; column-gap: 10px; }
.howto li::before { content: counter(s); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: .9rem; }
.howto li span { color: var(--muted); font-size: .88rem; }
.settings .sec { margin-top: 0; }
.toggle { display: flex; align-items: center; justify-content: space-between; min-height: 44px; position: relative; }
.toggle input { position: absolute; opacity: 0; width: 52px; height: 30px; right: 0; margin: 0; cursor: pointer; }
.toggle .sw { width: 50px; height: 30px; border-radius: 15px; background: #c5cdc5; position: relative; transition: background .2s; flex: none; pointer-events: none; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle input:checked + .sw { background: var(--green); }
.toggle input:checked + .sw::after { transform: translateX(20px); }
.toggle input:focus-visible + .sw { outline: 3px solid #1565c0; outline-offset: 2px; }
.notes { font-size: .8rem; color: var(--muted); margin-top: 16px; }
.notes p { margin: 6px 0; }
.notes .src a { color: var(--muted); }

/* ---------- 問題画面ヘッダー */
.qbar {
  position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 8px;
  margin: 0 -16px; padding: 4px 8px; background: rgba(244,246,242,.96); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.qbar.plain { justify-content: space-between; }
.segs { flex: 1; display: flex; gap: 3px; }
.seg { flex: 1; height: 6px; border-radius: 3px; background: #d6ddd3; }
.seg.now { background: #8bc34a; box-shadow: 0 0 0 2px rgba(139,195,74,.35); }
.seg.ok { background: var(--green); }
.seg.ng { background: #e57373; }
.seg.skip { background: #bdbdbd; }
.count { font-size: .85rem; font-weight: 700; color: var(--muted); min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.qtitle { font-size: 1.1rem; margin: 4px 0 8px; line-height: 1.35; outline: none; }

/* ---------- ステージ */
.stage-wrap { position: relative; border-radius: var(--radius); overflow: hidden; background: #2f7d33; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.stage-box { position: relative; }
.stage-wrap.sticky { position: sticky; top: 53px; z-index: 10; }
.stage { width: 100%; max-height: 48vh; max-height: 48dvh; margin: 0 auto; }
.stage-3d { aspect-ratio: 4 / 3; max-height: 50vh; background: #cfe6fb; }
.pitch-svg { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; }
.pitch-svg.placing { touch-action: none; cursor: crosshair; }
.scene3d-canvas { display: block; width: 100% !important; height: 100% !important; }
.pl-num { font-size: 1.45px; font-weight: 800; fill: #fff; text-anchor: middle; font-family: system-ui, sans-serif; }
.pl-gk { fill: #1a1a1a; }
.pl-ref { fill: #ffeb3b; font-size: 1.25px; }
.pl-small { font-size: 1.1px; fill: rgba(255,255,255,.85); font-weight: 700; }
.ov-label { font-size: 1.35px; font-weight: 800; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: .38px; stroke-linejoin: round; }
.ov-yellow { fill: #ffeb3b; } .ov-cyan { fill: #b2ebf2; } .ov-green { fill: #69f0ae; } .ov-muted { fill: rgba(255,255,255,.8); font-size: 1.15px; }
.ov-item { animation: fadeIn .5s ease both; }
.hl-ring { transition: opacity .2s; }
.hl-ring.pulse { animation: pulse 1.1s ease-in-out infinite; }
.draggable { cursor: grab; }
.drag-arrow { font-size: 2px; fill: #ffeb3b; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: .3px; animation: bob 1s ease-in-out infinite; }
.place-marker.ok circle:first-child { fill: rgba(105,240,174,.45); stroke: #69f0ae; }
.place-marker.ng circle:first-child { fill: rgba(255,138,128,.45); stroke: #ff8a80; }
.bubble rect, .bubble path { fill: #fff; stroke: #222; stroke-width: .08px; }
.bub-text { font-size: 1.7px; font-weight: 900; text-anchor: middle; fill: #111; }
.bub-whistle rect { fill: #fff59d; }
.bub-count rect { fill: #fff; } .bub-zero rect { fill: #ff8a80; }

.stage-caption {
  position: relative; display: flex; align-items: center; min-height: 2.9em; padding: 4px 12px 8px;
  background: #1f2a1f; color: #fff; font-size: .88rem; font-weight: 700; line-height: 1.35;
}
.stage-caption::before { content: "▶"; color: var(--yellow); font-size: .7rem; margin-right: 8px; opacity: 0; transition: opacity .2s; }
.stage-caption.show::before { opacity: 1; }
.stage-caption.none { display: none; }
.stage-play {
  position: absolute; inset: 0; border: 0; background: rgba(0,0,0,.28); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 800;
}
.stage-play .tri { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.95); position: relative; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.stage-play .tri::after { content: ""; position: absolute; left: 28px; top: 21px; border-left: 24px solid var(--green); border-top: 15px solid transparent; border-bottom: 15px solid transparent; }
.stage-play .lbl { text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.stage-play:active .tri { transform: scale(.95); }
.stage-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.72); color: var(--yellow); font-size: .78rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
.dir-chip { position: absolute; top: 8px; left: 8px; background: rgba(229,57,53,.92); color: #fff; font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; pointer-events: none; }
.stage-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; z-index: 2; background: rgba(255,255,255,.25); }
.stage-progress i { display: block; height: 100%; width: 0; background: var(--yellow); }
.loader { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; color: #234; font-weight: 700; padding: 16px; text-align: center; }
.loader .row { display: flex; gap: 8px; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(0,0,0,.12); border-top-color: var(--green); animation: spin .9s linear infinite; }

.cam-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 0; scrollbar-width: none; }
.cam { flex: 1 0 auto; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: .85rem; font-weight: 700; min-height: 40px; white-space: nowrap; }
.cam.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.cam.locked { color: #9aa59a; }
.cam .lock { margin-right: 3px; font-size: .75rem; }

.stage-tools { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0 0; }
.tool { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 4px 12px; min-height: 40px; font-size: .86rem; font-weight: 700; }
.tool:disabled { color: #a3ada3; background: #f1f3f0; }
.tool[aria-pressed="true"], .tool[aria-expanded="true"] { background: var(--green-l); border-color: #a5d6a7; color: var(--green-d); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); padding: 8px 2px 0; }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px #bbb; }
.d-red { background: #e53935; } .d-blue { background: #1e63d6; } .d-gk { background: #ffb300; border-color: #1e63d6; }
.d-ref { background: #111; border-color: #ffeb3b; } .d-ball { background: #fff; border-color: #222; width: 10px; height: 10px; }
.d-sub { background: #e53935; border-style: dashed; }
.d-sole { background: #ffca28; border-radius: 3px; }

/* ---------- 問い・選択肢 */
.panel { margin-top: 12px; }
.step-no { font-size: .8rem; font-weight: 800; color: var(--green-d); }
.step-hist { list-style: none; margin: 4px 0 6px; padding: 0; font-size: .85rem; }
.step-hist li { display: flex; gap: 6px; color: var(--muted); }
.step-hist .ok .mk { color: var(--green); font-weight: 800; } .step-hist .ng .mk { color: var(--red); font-weight: 800; }
.prompt { font-size: 1.05rem; font-weight: 700; margin: 4px 0 8px; }
.hint { background: #fffde7; border: 1px solid #fff59d; border-radius: 10px; padding: 8px 12px; margin: 6px 0; font-size: .92rem; }
.wait { font-size: .9rem; }
.choices { display: grid; gap: 8px; margin: 8px 0; scroll-margin-bottom: calc(90px + var(--safe-b)); }
.choice {
  display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; text-align: left;
  background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 56px;
  transition: border-color .12s, background .12s; animation: rise .25s ease both;
}
.choice:nth-child(2) { animation-delay: .04s; } .choice:nth-child(3) { animation-delay: .08s; } .choice:nth-child(4) { animation-delay: .12s; }
.choice .letter { width: 30px; height: 30px; border-radius: 8px; background: #eef2ec; display: grid; place-items: center; font-weight: 800; font-size: .9rem; color: var(--muted); }
.choice.sel { border-color: var(--green); background: var(--green-l); }
.choice.sel .letter { background: var(--green); color: #fff; }
.choice.is-correct { border-color: var(--green); background: var(--green-l); }
.choice.is-correct .letter { background: var(--green); color: #fff; }
.choice.is-wrong { border-color: var(--red); background: var(--red-l); }
.choice.is-wrong .letter { background: var(--red); color: #fff; }
.choice.is-dim { opacity: .55; }
.choice .cnote { grid-column: 2 / -1; font-size: .8rem; font-weight: 700; color: var(--muted); margin-top: -4px; }
.choice .mark { grid-column: 3; grid-row: 1; font-weight: 800; font-size: .85rem; white-space: nowrap; }
.choice.is-correct .mark { color: var(--green-d); } .choice.is-wrong .mark { color: var(--red); }
.choice-fb { margin: -2px 4px 4px 44px; font-size: .9rem; color: #7f1d1d; }
.place-help { background: #fff; border: 1.5px dashed #a5d6a7; border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
.place-fb { border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: .92rem; }
.place-fb p { margin: 2px 0; }
.place-fb.ok { background: var(--green-l); } .place-fb.ng { background: var(--red-l); }
.place-fb .desc { font-weight: 700; }
.verdict-mini { font-weight: 800; margin: 6px 0; }
.verdict-mini.ok { color: var(--green-d); } .verdict-mini.ng { color: var(--red); }
.term { background: none; border: 0; padding: 0; font-weight: 700; color: var(--green-d); text-decoration: underline dotted 2px; text-underline-offset: 3px; }

/* ---------- 解説 */
.explain { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; animation: rise .3s ease both; }
.verdict { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; margin-bottom: 6px; }
.v-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 1.2rem; flex: none; animation: pop .35s cubic-bezier(.3,1.6,.6,1) both; }
.verdict.ok .v-icon { background: var(--green); } .verdict.ng .v-icon { background: var(--red); } .verdict.part .v-icon { background: #ef8f00; }
.ex-sum { font-weight: 700; margin: 6px 0; }
.ex-tip { background: var(--blue-l); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.ex-detail summary { font-weight: 700; color: var(--green-d); cursor: pointer; min-height: 36px; display: flex; align-items: center; }
.ex-detail p { margin: 4px 0 8px; font-size: .95rem; }
.notice { border-radius: 10px; padding: 8px 12px; font-size: .86rem; margin: 8px 0; }
.notice.new { background: var(--blue-l); } .notice.warn { background: var(--amber-l); }
.refs { display: grid; gap: 6px; margin-top: 10px; font-size: .85rem; }
.ref { display: flex; flex-direction: column; text-decoration: none; background: #f7f9f6; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 700; }
.ref small { color: var(--muted); font-weight: 400; }
.rating { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; font-size: .88rem; }
.rate-row { display: flex; gap: 8px; margin-top: 6px; }
.rate { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; min-height: 42px; font-weight: 700; font-size: .88rem; }
.rate.on { background: var(--green-l); border-color: var(--green); }

/* ---------- 結果 */
.score { position: relative; width: 180px; margin: 24px auto 4px; text-align: center; }
.ring { width: 180px; height: 180px; }
.ring-val { transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
.score-num { position: absolute; top: 58px; left: 0; right: 0; }
.score-num strong { font-size: 2.6rem; line-height: 1; }
.score-num span { font-size: 1.1rem; color: var(--muted); }
.score-lv { margin: 0; font-weight: 700; color: var(--muted); }
.score-msg { text-align: center; font-weight: 700; margin: 8px 0 12px; }
.cat-row { display: grid; grid-template-columns: 7.5em 1fr 2.6em; gap: 8px; align-items: center; font-size: .88rem; margin: 6px 0; }
.bar { height: 10px; border-radius: 5px; background: #e6ebe4; box-shadow: inset 0 0 0 1px #cfd8cc; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 5px; }
.cat-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.res-list { list-style: none; margin: 0; padding: 0; }
.res-list li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.res-list li:first-child { border-top: 0; }
.res-list .mk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #fff; background: #bdbdbd; }
.res-list .ok .mk { background: var(--green); } .res-list .ng .mk { background: var(--red); }
.res-list .rt { display: flex; flex-direction: column; line-height: 1.35; }
.res-list .rt small { color: var(--muted); }
.tester .sec { margin-top: 0; }
.notes-input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; margin: 6px 0 8px; resize: vertical; }
.res-actions { display: grid; gap: 8px; margin: 16px 0; }

/* ---------- ポップアップ類 */
.gloss {
  position: fixed; left: 12px; right: 12px; bottom: calc(80px + var(--safe-b)); z-index: 40; max-width: 536px; margin: 0 auto;
  background: #1f2a1f; color: #fff; border-radius: 14px; padding: 10px 14px 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35);
  opacity: 0; transform: translateY(10px); transition: opacity .18s, transform .18s;
}
.gloss.show { opacity: 1; transform: none; }
.gloss-head { display: flex; align-items: center; justify-content: space-between; }
.gloss .icon-btn { color: #fff; width: 36px; height: 36px; }
.gloss p { margin: 2px 0 0; font-size: .92rem; }
.toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -20px); z-index: 50; background: #1f2a1f; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: .88rem; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal { background: #fff; border-radius: 16px; padding: 18px; max-width: 360px; width: 100%; }

/* ---------- アニメーション */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

/* ---------- スマホ横向き：左にピッチ、右に問いと選択肢（右側だけスクロール） */

        detail: '見る角度で印象が変わることを、視点を切り替えて確かめてください。主審の位置（後方）からは、足・ボール・相手が一直線に重なり、ボールに行ったように見えます。副審の位置からは、足裏が相手のすねに向いているのが見えます。真横からは、接触したときボールが2m以上前にあったことが分かります。だから主審は、副審とでプレーを挟む位置をとって死角をなくします。懲戒の判断（{{不用意}}／{{無謀}}／{{著しく不正なプレー}}）は、監修前の暫定解答です。',
        overlays: []
      },
      refs: [{ src: 'laws', article: '第12条 ファウルと不正行為' }]
    }

  window.QUIZ_DATA = { SRC: SRC, CATEGORIES: CATEGORIES, GLOSSARY: GLOSSARY, QUESTIONS: QUESTIONS, RULE_VERSION: '2026/27' };

  <script>
/* 2D ピッチ描画・アニメーション・配置操作
 * フィールド座標 (x: 0..68 長辺, y: 0..50 短辺) → 画面 (X = y, Y = 68 - x)
 * 赤チームは画面上方向（x=68 の青ゴール）へ攻撃する。
 */
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const L = 68, W = 50;
  const S = (x, y) => [y, L - x];

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, str, cls, extra) {
    const t = el('text', Object.assign({ x: x, y: y, class: cls || '' }, extra || {}), parent);
    t.textContent = str;
    return t;
  }

  const COLORS = {
    red: '#e53935', blue: '#1e63d6', gkBlue: '#ffb300', gkRed: '#8e24aa',
    ref: '#111', refRing: '#ffeb3b'
  };

  class Pitch2D {
    constructor(container, scene, opts) {
      this.c = container;
      this.scene = scene;
      this.opts = opts || {};
      this.mode = 'play';
      this.overrides = {};
      this.pinned = new Set();
      this.overlayDefs = [];
      this.t = 0;
      this._raf = null;
      this._buildTracks();
      this._build();
      this.render(0);
    }

    /* ------------------------------------------------ data */
    _buildTracks() {
      const tracks = {};
      const events = [];
      (this.scene.timeline || []).forEach(kf => {
        Object.keys(kf.positions || {}).forEach(id => {
          (tracks[id] = tracks[id] || []).push([kf.t, kf.positions[id][0], kf.positions[id][1]]);
        });
        (kf.events || []).forEach(ev => events.push(Object.assign({ t: kf.t }, ev)));
      });
      Object.values(tracks).forEach(a => a.sort((p, q) => p[0] - q[0]));
      this.tracks = tracks;
      this.events = events.sort((a, b) => a.t - b.t);
      const tl = this.scene.timeline || [];
      this.duration = tl.length ? tl[tl.length - 1].t : 0;
    }
    pos(id, t) {
      if (this.overrides[id]) return this.overrides[id];
      const tr = this.tracks[id];
      if (!tr || !tr.length) return null;
      if (t <= tr[0][0]) return [tr[0][1], tr[0][2]];
      for (let i = 1; i < tr.length; i++) {
        if (t <= tr[i][0]) {
          const a = tr[i - 1], b = tr[i];
          const k = b[0] === a[0] ? 1 : (t - a[0]) / (b[0] - a[0]);
          return [a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
        }
      }
      const z = tr[tr.length - 1];
      return [z[1], z[2]];
    }

    /* ------------------------------------------------ build */
    _build() {
      const v = this.scene.view || { x: 0, y: 0, w: L, h: W };
      const pad = this.scene.pad != null ? this.scene.pad : 1.5;
      const minX = v.y - pad, minY = L - (v.x + v.w) - pad;
      const vw = v.h + pad * 2, vh = v.w + pad * 2;
      this.vb = { minX, minY, vw, vh };
      const svg = el('svg', {
        viewBox: [minX, minY, vw, vh].join(' '),
        class: 'pitch-svg', role: 'img',
        'aria-label': 'ピッチの配置図。赤チームは上の青ゴールに向かって攻撃しています。'
      });
      this.svg = svg;
      this.c.innerHTML = '';
      this.c.appendChild(svg);
      this.c.style.aspectRatio = vw + ' / ' + vh;

      const defs = el('defs', null, svg);
      const f = el('filter', { id: 'sh', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
      el('feDropShadow', { dx: 0.12, dy: 0.22, stdDeviation: 0.18, 'flood-color': '#000', 'flood-opacity': 0.45 }, f);

      this.gGrass = el('g', null, svg);
      this.gLines = el('g', { class: 'lines' }, svg);
      this.gUnder = el('g', { class: 'ov-under' }, svg);
      this.gActors = el('g', null, svg);
      this.gOver = el('g', { class: 'ov' }, svg);
      this.gBubbles = el('g', null, svg);
      this.gPlace = el('g', { class: 'place' }, svg);

      this._drawPitch();
      this._drawActors();
    }

    _drawPitch() {
      const g = this.gGrass, ln = this.gLines;
      const o = this.scene.pitch || {};
      const { minX, minY, vw, vh } = this.vb;
      el('rect', { x: minX, y: minY, width: vw, height: vh, fill: '#2f7d33' }, g);
      for (let y = -20, i = 0; y < 90; y += 5, i++) {
        if (i % 2) el('rect', { x: minX, y: y, width: vw, height: 5, fill: '#358a39' }, g);
      }
      const line = { fill: 'none', stroke: '#fff', 'stroke-width': 0.14, 'stroke-opacity': 0.92 };
      el('rect', Object.assign({ x: 0, y: 0, width: W, height: L }, line), ln);
      el('line', Object.assign({ x1: 0, y1: 34, x2: W, y2: 34 }, line), ln);
      el('circle', Object.assign({ cx: 25, cy: 34, r: 7 }, line), ln);
      el('circle', { cx: 25, cy: 34, r: 0.22, fill: '#fff' }, ln);

      [0, 1].forEach(end => {
        // end 0 = 上（x=68 青ゴール）, end 1 = 下（x=0 赤ゴール）
        const gy = end === 0 ? 0 : L, dir = end === 0 ? 1 : -1;
        const Y = d => gy + dir * d;
        el('rect', Object.assign({ x: 10.5, y: Math.min(Y(0), Y(12)), width: 29, height: 12 }, line), ln);
        el('rect', Object.assign({ x: 18.5, y: Math.min(Y(0), Y(4)), width: 13, height: 4 }, line), ln);
        if (!o.hidePenaltyMark) el('circle', { cx: 25, cy: Y(8), r: 0.24, fill: '#fff' }, ln);
        if (!o.hidePenaltyArc) {
          const dx = Math.sqrt(49 - 16);
          el('path', Object.assign({ d: 'M ' + (25 - dx) + ' ' + Y(12) + ' A 7 7 0 0 ' + (end === 0 ? 0 : 1) + ' ' + (25 + dx) + ' ' + Y(12) }, line), ln);
        }
        // ゴール（5m × 奥行1m の表示）
        el('rect', { x: 22.5, y: end === 0 ? -1.1 : L, width: 5, height: 1.1, fill: 'rgba(255,255,255,0.28)', stroke: '#fff', 'stroke-width': 0.14 }, ln);
      });
      // コーナーアーク r=1
      el('path', Object.assign({ d: 'M 1 0 A 1 1 0 0 1 0 1' }, line), ln);
      el('path', Object.assign({ d: 'M ' + (W - 1) + ' 0 A 1 1 0 0 0 ' + W + ' 1' }, line), ln);
      el('path', Object.assign({ d: 'M 0 ' + (L - 1) + ' A 1 1 0 0 1 1 ' + L }, line), ln);
      el('path', Object.assign({ d: 'M ' + W + ' ' + (L - 1) + ' A 1 1 0 0 0 ' + (W - 1) + ' ' + L }, line), ln);
      // 交代ゾーン（ベンチ側 y=0、ハーフウェーラインから3mずつ）
      el('rect', { x: -0.9, y: L - 37, width: 0.9, height: 6, fill: 'rgba(255,235,59,0.45)' }, ln);
      [31, 34, 37].forEach(xx => el('line', Object.assign({ x1: 0, y1: L - xx, x2: -0.7, y2: L - xx }, line), ln));

      if (o.showBench) {
        const bench = (x1, x2, color, label) => {
          const [X, Y1] = S(x2, -5.2);
          el('rect', { x: X - 1.6, y: Y1, width: 1.6, height: x2 - x1, rx: 0.3, fill: color, opacity: 0.55, stroke: '#fff', 'stroke-width': 0.08 }, ln);
          txt(ln, X - 2.2, Y1 + (x2 - x1) / 2, label, 'pl-small', { transform: 'rotate(-90 ' + (X - 2.2) + ' ' + (Y1 + (x2 - x1) / 2) + ')', 'text-anchor': 'middle' });
        };
        bench(22, 30, COLORS.red, '赤ベンチ');
        bench(38, 46, COLORS.blue, '青ベンチ');
      }
      if (o.showFourthTable) {
        const [X, Y] = S(35, -5.6);
        el('rect', { x: X - 1.0, y: Y, width: 1.0, height: 2, rx: 0.2, fill: '#cfd8dc', stroke: '#fff', 'stroke-width': 0.08 }, ln);
      }
    }

    _drawActors() {
      this.actorEls = {};
      const actors = (this.scene.actors || []).slice().sort((a, b) => (a.role === 'ball') - (b.role === 'ball'));
      actors.forEach(a => {
        const g = el('g', { class: 'actor actor-' + a.role, 'data-id': a.id }, this.gActors);
        const hl = el('circle', { r: 2.2, class: 'hl-ring', fill: 'none', stroke: '#ffeb3b', 'stroke-width': 0.28, opacity: 0 }, g);
        if (a.role === 'ball') {
          el('circle', { r: 0.75, fill: '#fff', stroke: '#222', 'stroke-width': 0.16, filter: 'url(#sh)' }, g);
          el('circle', { r: 0.25, fill: '#222' }, g);
        } else if (a.role === 'referee' || a.role === 'assistant' || a.role === 'fourth' || a.role === 'assistantSingle') {
          el('circle', { r: 1.3, fill: COLORS.ref, stroke: COLORS.refRing, 'stroke-width': 0.3, filter: 'url(#sh)' }, g);
          const lab = { referee: '主', assistant: '副', fourth: '4', assistantSingle: '補' }[a.role];
          txt(g, 0, 0.48, lab, 'pl-num pl-ref');
          if (a.role === 'assistant') {
            const fl = el('g', { class: 'flag', opacity: 0 }, g);
            el('line', { x1: 0.8, y1: -0.6, x2: 0.8, y2: -2.8, stroke: '#ddd', 'stroke-width': 0.14 }, fl);
            el('rect', { x: 0.8, y: -2.8, width: 1.3, height: 0.9, fill: '#ffeb3b', stroke: '#e53935', 'stroke-width': 0.12 }, fl);
          }
        } else {
          const gk = a.role === 'goalkeeper';
          const fill = gk ? (a.team === 'blue' ? COLORS.gkBlue : COLORS.gkRed) : COLORS[a.team];
          const ring = gk ? COLORS[a.team] : '#fff';
          el('circle', {
            r: 1.42, fill: fill, stroke: ring, 'stroke-width': gk ? 0.36 : 0.2, filter: 'url(#sh)',
            'stroke-dasharray': a.role === 'substitute' ? '0.5 0.3' : null
          }, g);
          txt(g, 0, 0.52, a.label || '', 'pl-num' + (gk ? ' pl-gk' : ''));
        }
        this.actorEls[a.id] = { g: g, hl: hl, def: a, flag: g.querySelector('.flag') };
      });
      if (this.scene.spotlight && this.actorEls[this.scene.spotlight]) {
        this.actorEls[this.scene.spotlight].hl.setAttribute('opacity', 1);
        this.actorEls[this.scene.spotlight].hl.classList.add('pulse');
      }
    }

    /* ------------------------------------------------ overlays (解説) */
    setOverlays(list) {
      this.gOver.innerHTML = '';
      this.gUnder.innerHTML = '';
      this.overlayDefs = (list || []).map(def => this._makeOverlay(def)).filter(Boolean);
      this.render(this.t);
    }
    _label(parent, str, cls) { return txt(parent, 0, 0, str, 'ov-label ' + (cls || '')); }
    _makeOverlay(d) {
      const self = this;
      const P = ref => Array.isArray(ref) ? ref : self.pos(ref, self.t);
      if (d.type === 'offsideLine') {
        const g = el('g', { class: 'ov-item' }, this.gOver);
        const l = el('line', { x1: -0.5, x2: W + 0.5, stroke: '#ffeb3b', 'stroke-width': 0.24, 'stroke-dasharray': '1 0.5' }, g);
        const t = this._label(g, d.label || '', 'ov-yellow');
        t.setAttribute('text-anchor', 'start');
        return { update: tt => { const p = self.pos(d.actor, tt); if (!p) return; const Y = L - p[0]; l.setAttribute('y1', Y); l.setAttribute('y2', Y); t.setAttribute('x', 0.6); t.setAttribute('y', Y - 0.7); } };
      }
      if (d.type === 'distanceCircle') {
        const g = el('g', { class: 'ov-item' }, this.gOver);
        const c = el('circle', { r: d.radius, fill: d.muted ? 'none' : 'rgba(255,255,255,0.10)', stroke: d.muted ? 'rgba(255,255,255,0.75)' : '#fff', 'stroke-width': 0.2, 'stroke-dasharray': d.dashed ? '0.8 0.5' : null }, g);
        const t = this._label(g, d.label || '', d.muted ? 'ov-muted' : '');
        t.setAttribute('text-anchor', 'end');
        return { update: tt => { const p = P(d.center === 'ball' ? 'ball' : d.center); if (!p) return; const [X, Y] = S(p[0], p[1]); c.setAttribute('cx', X); c.setAttribute('cy', Y); const ang = d.muted ? 2.55 : 2.2; t.setAttribute('x', X + d.radius * Math.cos(ang) - 0.4); t.setAttribute('y', Y + d.radius * Math.sin(ang) + 1.4); } };
      }
      if (d.type === 'sightLine') {
        const g = el('g', { class: 'ov-item' }, this.gOver);
        const l = el('line', { stroke: '#80deea', 'stroke-width': 0.2, 'stroke-dasharray': '0.6 0.4' }, g);
        const t = this._label(g, d.label || '', 'ov-cyan');
        return { update: tt => { const a = self.pos(d.from, tt), b = self.pos(d.to, tt); if (!a || !b) return; const A = S(a[0], a[1]), B = S(b[0], b[1]); l.setAttribute('x1', A[0]); l.setAttribute('y1', A[1]); l.setAttribute('x2', B[0]); l.setAttribute('y2', B[1]); t.setAttribute('x', (A[0] + B[0]) / 2); t.setAttribute('y', (A[1] + B[1]) / 2 + 2.2); } };
      }
      if (d.type === 'zone') {
        const g = el('g', { class: 'ov-item' }, this.gUnder);
        const [X1, Y1] = S(d.x2, d.y1);
        el('rect', { x: X1, y: Y1, width: d.y2 - d.y1, height: d.x2 - d.x1, fill: 'rgba(255,235,59,0.35)', stroke: '#ffeb3b', 'stroke-width': 0.18 }, g);
        const t = this._label(this.gOver, d.label || '', 'ov-yellow');
        t.setAttribute('x', X1 + (d.y2 - d.y1) + 0.8); t.setAttribute('y', Y1 + (d.x2 - d.x1) / 2 + 0.5); t.setAttribute('text-anchor', 'start');
        return { update: () => {} };
      }
      if (d.type === 'marker') {
        const g = el('g', { class: 'ov-item' }, this.gOver);
        const [X, Y] = S(d.at[0], d.at[1]);
        el('circle', { cx: X, cy: Y, r: 0.45, fill: '#fff' }, g);
        el('circle', { cx: X, cy: Y, r: 1.2, fill: 'none', stroke: '#69f0ae', 'stroke-width': 0.22 }, g);
        return { update: () => {} };
      }
      if (d.type === 'ruler') {
        const g = el('g', { class: 'ov-item' }, this.gOver);
        const A = S(d.from[0], d.from[1]), B = S(d.to[0], d.to[1]);
        el('line', { x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: '#69f0ae', 'stroke-width': 0.2 }, g);
        [A, B].forEach(p => el('line', { x1: p[0] - 0.7, y1: p[1], x2: p[0] + 0.7, y2: p[1], stroke: '#69f0ae', 'stroke-width': 0.2 }, g));
        const t = this._label(g, d.label || '', 'ov-green');
        t.setAttribute('x', A[0] - 1.0); t.setAttribute('y', (A[1] + B[1]) / 2 + 0.5); t.setAttribute('text-anchor', 'end');
        return { update: () => {} };
      }
      return null;
    }

    /* ------------------------------------------------ render */
    render(t) {
      this.t = t;
      Object.keys(this.actorEls).forEach(id => {
        const a = this.actorEls[id];
        const p = this.pos(id, t);
        if (!p) { a.g.setAttribute('display', 'none'); return; }
        a.g.removeAttribute('display');
        const [X, Y] = S(p[0], p[1]);
        a.g.setAttribute('transform', 'translate(' + X.toFixed(3) + ' ' + Y.toFixed(3) + ')');
        if (id !== this.scene.spotlight && !this.pinned.has(id)) a.hl.setAttribute('opacity', 0);
      });
      // events: highlight / bubbles / captions
      this.gBubbles.innerHTML = '';
      let caption = '';
      this.events.forEach(ev => {
        if (ev.t > t + 1e-6) return;
        const age = t - ev.t;
        if (ev.type === 'caption') caption = ev.text;
        else if (ev.type === 'highlight' && age <= (ev.dur || 1.5) && this.actorEls[ev.actor]) this.actorEls[ev.actor].hl.setAttribute('opacity', 1);
        else if (ev.type === 'whistle' && age <= 0.9) this._bubble('REF', 'ピッ！', 'bub-whistle');
        else if (ev.type === 'countdown' && age <= ev.dur + 0.5) {
          const n = Math.max(0, Math.ceil((ev.from || 5) - age));
          this._bubble(ev.by || 'REF', '✋ ' + n, 'bub-count' + (n === 0 ? ' bub-zero' : ''));
        } else if (ev.type === 'flag') {
          const a = this.actorEls[ev.by];
          if (a && a.flag) a.flag.setAttribute('opacity', age <= (ev.dur || 99) ? 1 : 0);
        }
      });
      if (this.opts.onCaption && caption !== this._lastCaption) { this._lastCaption = caption; this.opts.onCaption(caption); }
      this.overlayDefs.forEach(o => o.update(t));
    }
    _bubble(actorId, str, cls) {
      const p = this.pos(actorId, this.t);
      if (!p) return;
      const [X, Y] = S(p[0], p[1]);
      const g = el('g', { class: 'bubble ' + cls, transform: 'translate(' + X + ' ' + (Y - 3.6) + ')' }, this.gBubbles);
      const w = Math.max(4.6, str.length * 1.6);
      el('rect', { x: -w / 2, y: -1.6, width: w, height: 2.9, rx: 0.8 }, g);
      el('path', { d: 'M -0.6 1.3 L 0 2.2 L 0.6 1.3 Z' }, g);
      txt(g, 0, 0.6, str, 'bub-text');
    }

    /* ------------------------------------------------ playback */
    play(o) {
      this.stop();
      const from = o.from || 0, to = o.to != null ? o.to : this.duration, speed = o.speed || 1;
      this.t = from;
      this._lastCaption = null;
      let last = performance.now(), prevT = from;
      const evs = this.events;
      const step = now => {
        const dt = Math.min(0.1, (now - last) / 1000) * speed;
        last = now;
        const nt = Math.min(to, this.t + dt);
        // サウンド等のイベント通知
        if (this.opts.onEvent) {
          evs.forEach(ev => {
            if (ev.t > prevT && ev.t <= nt) this.opts.onEvent(ev);
            if (ev.type === 'countdown') {
              const a = Math.floor(prevT - ev.t), b = Math.floor(nt - ev.t);
              if (b > a && b >= 1 && b <= ev.dur) this.opts.onEvent({ type: 'tick', n: (ev.from || 5) - b });
            }
          });
        }
        prevT = nt;
        this.render(nt);
        if (this.opts.onProgress) this.opts.onProgress((nt - from) / Math.max(0.001, to - from));
        if (nt >= to) { this._raf = null; if (o.onEnd) o.onEnd(); return; }
        this._raf = requestAnimationFrame(step);
      };
      if (from === 0 && this.opts.onEvent) evs.forEach(ev => { if (ev.t === 0) this.opts.onEvent(ev); });
      this.render(from);
      this._raf = requestAnimationFrame(step);
    }
    stop() { if (this._raf) cancelAnimationFrame(this._raf); this._raf = null; }
    get playing() { return !!this._raf; }
    seek(t) { this.stop(); this.render(t); }

    /* ------------------------------------------------ placement */
    _toField(evt) {
      const pt = this.svg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      const m = this.svg.getScreenCTM();
      if (!m) return null;
      const p = pt.matrixTransform(m.inverse());
      return [L - p.y, p.x];
    }
    enablePlacement(cfg, onChange) {
      this.placeCfg = cfg;
      this.placeVal = null;
      this.svg.classList.add('placing');
      const self = this;
      let dragging = false;
      if (cfg.mode === 'line') {
        // ドラッグ可能アイコンのヒント
        const a = this.actorEls[cfg.actor];
        if (a) {
          a.g.classList.add('draggable');
          this.pinned.add(cfg.actor);
          a.hl.setAttribute('opacity', 1);
          a.hl.classList.add('pulse');
          const hint = el('g', { class: 'drag-hint' }, a.g);
          txt(hint, 0, -2.6, '▲', 'drag-arrow');
          txt(hint, 0, 4.2, '▼', 'drag-arrow');
          this._dragHint = hint;
        }
      } else {
        this.placeMarker = el('g', { class: 'place-marker', display: 'none' }, this.gPlace);
        el('circle', { r: 1.4, fill: 'rgba(255,255,255,0.25)', stroke: '#fff', 'stroke-width': 0.2 }, this.placeMarker);
        el('circle', { r: 0.32, fill: '#fff' }, this.placeMarker);
        txt(this.placeMarker, 0, -2.0, cfg.marker || 'ここ', 'ov-label');
      }
      const apply = p => {
        if (!p) return;
        if (cfg.mode === 'line') {
          const x = Math.max(cfg.min, Math.min(cfg.max, p[0]));
          self.placeVal = [x, cfg.fixedY];
          self.overrides[cfg.actor] = self.placeVal;
          if (self._dragHint) { self._dragHint.remove(); self._dragHint = null; }
        } else {
          const x = Math.max(34, Math.min(L, p[0])), y = Math.max(0, Math.min(W, p[1]));
          self.placeVal = [x, y];

      h('div', { class: 'levels', role: 'radiogroup', 'aria-label': 'レベル' }, cards),
      h('div', { class: 'howto' },
        h('h2', { class: 'sec', text: '遊び方' }),
        h('ol', null,
          h('li', null, h('b', { text: 'プレーを見る' }), h('span', { text: '先に問いを読んでから再生。判定の瞬間で止まります' })),
          h('li', null, h('b', { text: '判定する' }), h('span', { text: '選択肢を選ぶ、または審判や位置をドラッグして「判定する」' })),
          h('li', null, h('b', { text: '解説リプレイ' }), h('span', { text: 'ラインや距離を重ねて、もう一度再生します' })))),
      h('div', { class: 'card settings' },
        h('h2', { class: 'sec', text: '設定' }),
        toggleRow('効果音（笛など）', 'sound'),
        toggleRow('振動（対応端末のみ）', 'haptics')),
      h('div', { class: 'notes' },
        h('p', null, h('b', { text: '試作版について：' }), '問題と解説は監修前です。実際の判定はJFAの競技規則に従ってください。'),
        h('p', null, h('b', { text: '2026/27改正：' }), '地域・都道府県の大会では、主催者が適用開始日を決めます（遅くとも2027年4月1日）。🆕の問題は大会要項で確認しましょう。'),
        h('p', { class: 'src' }, '出典：', Object.keys(D.SRC).map((k, i) => [i ? '／' : '', h('a', { href: D.SRC[k].url, target: '_blank', rel: 'noopener', text: D.SRC[k].label })]))),
      h('div', { class: 'actionbar' }, startBtn));
    app.appendChild(screen);
  }

  function startRound(level, ids, round) {
    S.level = level;
    S.order = ids || D.QUESTIONS.filter(q => q.levels.indexOf(level) >= 0).map(q => q.id);
    S.idx = 0;
    if (round !== 'retry') S.results = {};
    S.round = round || 'main';
    S.finished = false;
    save();
    renderQuestion();
  }

  /* ================================================= 問題画面 */
  function renderQuestion() {
    if (S.idx >= S.order.length) { S.finished = true; save(); renderResult(); return; }
    mountQuestion(QMAP[S.order[S.idx]], {});
  }

  const LETTERS = ['A', 'B', 'C', 'D', 'E'];

  function legendEl(is3d) {
    const dot = (cls, label) => h('span', { class: 'lg' }, h('i', { class: 'dot ' + cls }), label);
    if (is3d) return h('div', { class: 'legend', hidden: true },
      dot('d-red', '赤10番（攻撃）'), dot('d-blue', '青4番（守備）'), dot('d-gk', 'GK'), dot('d-ref', '黒＝審判'), dot('d-sole', '黄色＝スパイクの裏'));
    return h('div', { class: 'legend', hidden: true },
      dot('d-red', '赤チーム（↑へ攻撃）'), dot('d-blue', '青チーム'), dot('d-gk', '青GK'),
      dot('d-ref', '主＝主審 / 副＝副審 / 4＝第4の審判員'), dot('d-ball', 'ボール'), dot('d-sub', '点線＝交代要員'));
  }

  function mountQuestion(q, opts) {
    teardown();
    const review = !!opts.review;
    const L = lv();
    const steps = stepsFor(q);
    const is3d = q.kind === '3d';
    const scene = q.scene || {};
    const pauseAt = is3d ? q.scene3d.pauseAt : scene.pauseAt;
    const endAt = is3d ? q.scene3d.endAt : (scene.endAt || scene.pauseAt);
    const hasAnim = is3d || (pauseAt > 0 && !scene.static);
    const st = { phase: 'intro', step: 0, sel: null, res: [], views: 0, speed: 1, place: null, hint: false, done: false };
    let engine = null, destroyed = false;

    /* ---------- DOM */
    const stage = h('div', { class: 'stage' + (is3d ? ' stage-3d' : '') });
    const caption = h('div', { class: 'stage-caption', 'aria-live': 'polite' });
    const playOverlay = h('button', { type: 'button', class: 'stage-play', 'aria-label': 'プレーを再生する', onClick: () => watch() },
      h('span', { class: 'tri', 'aria-hidden': 'true' }), h('span', { class: 'lbl', text: 'プレーを見る' }));
    const freezeBadge = h('div', { class: 'stage-badge', hidden: true, text: '⏸ 判定の瞬間' });
    const progBar = h('i');
    const hasRed = !is3d && (scene.actors || []).some(a => a.team === 'red' && a.role !== 'substitute');
    const dirChip = hasRed ? h('div', { class: 'dir-chip', 'aria-hidden': 'true', text: '赤の攻撃 ↑' }) : null;
    const camTabs = is3d ? h('div', { class: 'cam-tabs', role: 'tablist', 'aria-label': '視点' }) : null;
    const hasCaptions = is3d ? (q.scene3d.captions || []).length > 0 : (scene.timeline || []).some(k => (k.events || []).some(e => e.type === 'caption'));
    if (!hasCaptions) caption.classList.add('none');
    const stageBox = h('div', { class: 'stage-box' }, stage, dirChip, freezeBadge, playOverlay);
    const stageWrap = h('div', { class: 'stage-wrap' }, stageBox, caption, h('div', { class: 'stage-progress' }, progBar));
    const legend = legendEl(is3d);

    const btnReplay = h('button', { type: 'button', class: 'tool', onClick: () => replay() });
    const btnSlow = h('button', { type: 'button', class: 'tool', 'aria-pressed': 'false', onClick: () => toggleSpeed() });
    const btnLegend = h('button', { type: 'button', class: 'tool', 'aria-expanded': 'false', onClick: () => {
      legend.hidden = !legend.hidden; btnLegend.setAttribute('aria-expanded', legend.hidden ? 'false' : 'true');
    } }, '凡例');
    const btnContact = is3d ? h('button', { type: 'button', class: 'tool', hidden: true, onClick: () => { if (engine) { engine.seek(engine.contactAt); setProg(engine.contactAt / endAt); } } }, '⏱ 接触の瞬間') : null;
    const tools = h('div', { class: 'stage-tools' }, btnReplay, btnSlow, btnContact, btnLegend);

    const panel = h('section', { class: 'panel' });
    const action = h('button', { type: 'button', class: 'btn primary big' });

    // ヘッダー（進捗）
    const segs = S.order.map((id, i) => {
      const r = S.results[id];
      let cls = 'seg';
      if (!review && i === S.idx) cls += ' now';
      else if (r && r.skipped) cls += ' skip';
      else if (r) cls += r.ok ? ' ok' : ' ng';
      return h('i', { class: cls });
    });
    const soundBtn = h('button', { type: 'button', class: 'icon-btn', 'aria-label': '効果音の切り替え', 'aria-pressed': S.settings.sound ? 'true' : 'false',
      onClick: () => { S.settings.sound = !S.settings.sound; save(); soundBtn.textContent = S.settings.sound ? '🔊' : '🔇'; soundBtn.setAttribute('aria-pressed', S.settings.sound ? 'true' : 'false'); if (S.settings.sound) Sound.unlock(); } },
      S.settings.sound ? '🔊' : '🔇');
    const header = h('header', { class: 'qbar' },
      h('button', { type: 'button', class: 'icon-btn', 'aria-label': review ? '結果に戻る' : '中断する', onClick: () => quit() }, '×'),
      h('div', { class: 'segs', 'aria-hidden': 'true' }, segs),
      h('span', { class: 'count', text: review ? '復習' : (S.idx + 1) + ' / ' + S.order.length }),
      soundBtn);

    const badges = [];
    if (q.badges.indexOf('new2026') >= 0) badges.push(h('span', { class: 'chip chip-new', text: '🆕 2026/27改正' }));
    if (q.badges.indexOf('provisional') >= 0) badges.push(h('span', { class: 'chip chip-warn', text: '一部 監修前' }));
    const title = h('h2', { class: 'qtitle', tabindex: '-1', text: q.title });
    const main = h('main', { class: 'qmain' },
      h('div', { class: 'qmeta' }, h('span', { class: 'chip chip-cat', text: D.CATEGORIES[q.category] }), badges, h('span', { class: 'chip chip-lv', text: L.label })),
      title, stageWrap, camTabs, tools, legend, panel);
    const screen = h('div', { class: 'screen quiz' + (is3d ? ' is3d' : '') }, header, main, h('div', { class: 'actionbar' }, action));
    app.appendChild(screen);
    scrollTopNow();
    setTimeout(() => title.focus({ preventScroll: true }), 50);

    /* ---------- エンジン */
    function setCaption(text) { caption.textContent = text || ''; caption.classList.toggle('show', !!text); }
    function setProg(k) { progBar.style.width = (Math.max(0, Math.min(1, k)) * 100).toFixed(1) + '%'; }
    function onEv(ev) { if (ev.type === 'whistle') Sound.whistle(); else if (ev.type === 'tick') Sound.tick(); }

    function ready() {
      if (destroyed) return;
      if (hasAnim) setPhase('intro'); else setPhase('answering');
    }
    if (is3d) {
      stage.appendChild(h('div', { class: 'loader' }, h('span', { class: 'spin' }), '3Dを読み込み中…'));
      playOverlay.hidden = true;
      const caps = q.scene3d.captions || [];
      window.Scene3D.create(stage, q.scene3d, {
        onProgress: k => setProg(k),
        onTime: t => { let c = ''; caps.forEach(x => { if (x.t <= t + 1e-6) c = x.text; }); if (c !== caption.textContent) setCaption(c); }
      }).then(e => {
        if (destroyed) { e.destroy(); return; }
        engine = e; buildCamTabs(); ready();
      }).catch(err => {
        console.error(err);
        stage.innerHTML = '';
        if (camTabs) camTabs.hidden = true;
        const noGL = /WebGL/i.test(String((err && err.message) || err));
        stage.appendChild(h('div', { class: 'loader fail' },
          h('p', { text: noGL ? 'この端末・ブラウザでは3D表示が使えないようです。別のブラウザ（Chrome / Safari の最新版）でお試しください。' : '3Dを読み込めませんでした。通信環境を確認して、もう一度お試しください。' }),
          h('small', { class: 'err-detail', text: '詳細: ' + String((err && err.message) || err).slice(0, 160) }),
          h('div', { class: 'row' },
            h('button', { type: 'button', class: 'btn ghost', onClick: () => mountQuestion(q, opts) }, '再試行'),
            review ? null : h('button', { type: 'button', class: 'btn ghost', onClick: () => skip() }, 'この問題をとばす'))));
        panel.innerHTML = '';
        action.hidden = true;
      });
    } else {
      engine = new window.Pitch2D(stage, scene, { onCaption: setCaption, onEvent: onEv, onProgress: setProg });
      ready();
    }

    function buildCamTabs() {
      camTabs.innerHTML = '';
      window.Scene3D.CAMERAS.forEach(c => {
        const b = h('button', { type: 'button', role: 'tab', class: 'cam' + (c.id === 'referee' ? ' on' : ''), 'data-id': c.id, 'aria-selected': c.id === 'referee' ? 'true' : 'false',
          onClick: () => {
            if (b.classList.contains('locked')) { toast('解答したあとに、ほかの視点で見られます'); return; }
            camTabs.querySelectorAll('.cam').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', on ? 'true' : 'false'); });
            engine.setCamera(c.id, true);
          } }, c.id !== 'referee' ? h('span', { class: 'lock', 'aria-hidden': 'true', text: '🔒' }) : null, c.label);
        if (c.id !== 'referee') b.classList.add('locked');
        camTabs.appendChild(b);
      });
    }
    function unlockCams(to) {
      if (!camTabs) return;
      camTabs.querySelectorAll('.cam').forEach(b => { b.classList.remove('locked'); const l = b.querySelector('.lock'); if (l) l.remove(); });
      const t = camTabs.querySelector('[data-id="' + to + '"]');
      if (t) t.click();
    }

    /* ---------- 再生 */
    const canReplayBeforeAnswer = () => L.replays === Infinity || st.views <= L.replays;
    function watch() {
      if (!engine) return;
      Sound.unlock();
      st.views++;
      setPhase(st.phase === 'intro' ? 'watching' : st.phase, true);
      playOverlay.hidden = true;
      freezeBadge.hidden = true;
      const wasAnswering = st.phase === 'answering';
      if (!wasAnswering) setPhase('watching');
      engine.play({ from: 0, to: pauseAt, speed: st.speed, onEnd: () => {
        freezeBadge.hidden = false;
        if (st.phase === 'watching') setPhase('answering'); else updateTools();
      } });
      updateTools();
    }
    function replay() {
      if (!engine) return;
      if (st.phase === 'feedback') { playExplain(); return; }
      if (!canReplayBeforeAnswer()) return;
      watch();
    }
    function playExplain() {
      if (!engine) return;
      freezeBadge.hidden = true;
      if (is3d) engine.play({ from: 0, to: endAt, speed: st.speed });
      else if (hasAnim) engine.play({ from: 0, to: endAt, speed: st.speed, onEnd: () => updateTools() });
      updateTools();
    }
    function toggleSpeed() {
      const seq = is3d ? [1, 0.5, 0.25] : [1, 0.5];
      st.speed = seq[(seq.indexOf(st.speed) + 1) % seq.length];
      btnSlow.setAttribute('aria-pressed', st.speed < 1 ? 'true' : 'false');
      updateTools();
      toast(st.speed === 1 ? '通常の速さ' : st.speed + '倍のスロー再生');
    }
    function updateTools() {
      const fb = st.phase === 'feedback';
      tools.hidden = !hasAnim && !fb;
      btnReplay.hidden = !hasAnim;
      if (fb) { btnReplay.disabled = false; btnReplay.textContent = '↺ 解説リプレイ'; }
      else {
        const left = L.replays === Infinity ? Infinity : L.replays - (st.views - 1);
        btnReplay.disabled = st.phase === 'intro' || st.phase === 'watching' || left <= 0;
        btnReplay.textContent = left === Infinity ? '↺ もう一度見る' : (left > 0 ? '↺ もう一度見る（残り' + left + '回）' : '見直しは1回まで');
      }
      const slowOk = fb || L.slow;
      btnSlow.hidden = !hasAnim || !slowOk;
      btnSlow.textContent = '🐢 ' + (st.speed === 1 ? 'スロー' : st.speed + '倍');
      if (btnContact) btnContact.hidden = !fb;
    }

    /* ---------- フェーズ */
    function setPhase(p) {
      st.phase = p;
      if (p === 'intro') {
        playOverlay.hidden = false;
        renderPrompt(false);
        setAction('▶ プレーを見る', false, () => watch());
      } else if (p === 'watching') {
        if (!panel.querySelector('.prompt')) renderPrompt(false);
        setAction('再生中…', true);
      } else if (p === 'answering') {
        playOverlay.hidden = true;
        renderPrompt(true);
        setAction('判定する', true, () => submit());
        refreshSubmit();
      }
      updateTools();
    }
    function setAction(label, disabled, fn) {
      action.hidden = false;
      action.textContent = label;
      action.disabled = !!disabled;
      action.onclick = fn || null;
    }
    function refreshSubmit() {
      const s = steps[st.step];
      const ok = s.type === 'placement' ? !!st.place : !!st.sel;
      action.disabled = !ok;
      action.textContent = ok ? '判定する' : (s.type === 'placement' ? '位置を決めてください' : '選択肢を選んでください');
    }

    /* ---------- 問い・選択肢 */
    function stepHistory() {
      if (st.step === 0) return null;
      return h('ol', { class: 'step-hist' }, st.res.map((r, i) => {
        const s = steps[i];
        const txt = s.type === 'placement' ? '位置' : (s.choices.find(c => c.id === r.pick) || {}).text;
        return h('li', { class: r.ok ? 'ok' : 'ng' }, h('span', { class: 'mk', text: r.ok ? '✓' : '✗' }), h('span', { text: txt || '' }));
      }));
    }
    function renderPrompt(showChoices) {
      const s = steps[st.step];
      panel.innerHTML = '';
      const parts = [];
      if (steps.length > 1) parts.push(h('div', { class: 'step-no', text: '質問 ' + (st.step + 1) + ' / ' + steps.length }));
      parts.push(stepHistory());
      parts.push(h('p', { class: 'prompt' }, rich(s.question)));
      if (L.hints && q.hint && st.step === 0 && !review) {
        const hintBox = h('p', { class: 'hint', hidden: !st.hint, text: '💡 ' + q.hint });
        const hintBtn = h('button', { type: 'button', class: 'link-btn', hidden: st.hint, onClick: () => { st.hint = true; hintBox.hidden = false; hintBtn.hidden = true; } }, '💡 ヒントを見る');
        parts.push(hintBtn, hintBox);
      }
      if (!showChoices) {
        parts.push(h('p', { class: 'muted wait', text: hasAnim ? '問いを読んだら、プレーを再生しましょう。判定の瞬間で止まり、選択肢が出ます。' : '' }));
      } else if (s.type === 'choice') {
        const list = h('div', { class: 'choices', role: 'radiogroup', 'aria-label': '選択肢' });
        s.choices.forEach((c, i) => {
          const b = h('button', { type: 'button', class: 'choice', role: 'radio', 'aria-checked': 'false', 'data-id': c.id,
            onClick: () => {
              if (st.done) return;
              st.sel = c.id;
              list.querySelectorAll('.choice').forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); });
              buzz(8);
              refreshSubmit();
            } },
            h('span', { class: 'letter', text: LETTERS[i] }), h('span', { class: 'ctext' }, rich(c.text)));
          list.appendChild(b);
        });
        parts.push(list);
        setTimeout(() => { if (!destroyed && list.isConnected) list.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 120);
      } else if (s.type === 'placement') {
        const pc = s.placement;
        parts.push(h('p', { class: 'place-help', text: pc.mode === 'line' ? '↕ 副審をタッチラインに沿って上下にドラッグ。ピッチをタップしても動かせます。' : '👆 ピッチをタップして置き、ドラッグで微調整できます。' }));
        engine.enablePlacement(pc, p => { st.place = p; refreshSubmit(); });
      }
      append(panel, parts);
    }

    /* ---------- 判定 */
    function judgePlacement(pc, p) {
      const dist = pc.mode === 'line' ? Math.abs(p[0] - pc.target[0]) : Math.hypot(p[0] - pc.target[0], p[1] - pc.target[1]);
      const ok = dist <= pc.tolerance;
      let note = '';
      if (!ok) (pc.zones || []).some(z => {
        const d = z.at ? Math.hypot(p[0] - z.at[0], p[1] - z.at[1]) : Math.abs(p[0] - z.lineX);
        if (d <= z.r) { note = z.text; return true; }
        return false;
      });
      return { ok: ok, note: note, desc: pc.describe ? pc.describe(p) : '' };
    }
    function submit() {
      if (st.done) return;
      const s = steps[st.step];
      let r;
      if (s.type === 'choice') {
        r = { ok: st.sel === s.answer, pick: st.sel };
        panel.querySelectorAll('.choice').forEach(b => {
          const id = b.getAttribute('data-id');
          b.disabled = true;
          const cc = s.choices.find(x => x.id === id);
          if (cc && cc.note) b.appendChild(h('span', { class: 'cnote', text: cc.note }));
          if (id === s.answer) { b.classList.add('is-correct'); b.appendChild(h('span', { class: 'mark', text: '✓ 正解' })); }
          else if (id === st.sel) {
            b.classList.add('is-wrong');
            b.appendChild(h('span', { class: 'mark', text: '✗' }));
            const c = s.choices.find(x => x.id === id);
            if (c && c.feedback) b.after(h('p', { class: 'choice-fb' }, rich(c.feedback)));
          } else b.classList.add('is-dim');
        });
      } else {
        const j = judgePlacement(s.placement, st.place);
        r = { ok: j.ok, pick: st.place };
        engine.disablePlacement();
        engine.showPlacementResult(st.place, s.placement, j.ok);
        const ph = panel.querySelector('.place-help'); if (ph) ph.remove();
        panel.appendChild(h('div', { class: 'place-fb ' + (j.ok ? 'ok' : 'ng') },
          h('p', { class: 'desc', text: j.desc }), j.note ? h('p', { text: j.note }) : null));
      }
      st.res.push(r);
      panel.querySelectorAll('.link-btn, .hint').forEach(x => x.remove());
      if (r.ok) { Sound.good(); buzz(18); } else { Sound.bad(); buzz([30, 50, 30]); }
      panel.appendChild(h('p', { class: 'verdict-mini ' + (r.ok ? 'ok' : 'ng'), role: 'status', text: r.ok ? '✓ 正解！' : '✗ ざんねん' }));
      if (st.step < steps.length - 1) {
        st.phase = 'stepResult';
        setAction('次の質問へ →', false, () => { st.step++; st.sel = null; setPhase('answering'); panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
      } else {
        st.done = true;
        enterFeedback();
      }
    }

    /* ---------- 解説 */
    function enterFeedback() {
      st.phase = 'feedback';
      const nOk = st.res.filter(r => r.ok).length;
      const okAll = nOk === steps.length;
      if (!review) {
        S.results[q.id] = { ok: okAll, n: nOk, total: steps.length, hint: st.hint, views: st.views, at: Date.now() };
        save();
        const seg = segs[S.idx]; if (seg) { seg.classList.remove('now'); seg.classList.add(okAll ? 'ok' : 'ng'); }
      }
      const vText = okAll ? '正解！' : (nOk > 0 ? 'おしい！ ' + nOk + ' / ' + steps.length + ' 問正解' : 'ざんねん');
      const verdict = h('div', { class: 'verdict ' + (okAll ? 'ok' : (nOk ? 'part' : 'ng')) },
        h('span', { class: 'v-icon', 'aria-hidden': 'true', text: okAll ? '✓' : (nOk ? '△' : '✗') }), h('strong', { text: vText }));
      const ex = q.explain;
      const notices = [];
      if (q.badges.indexOf('new2026') >= 0) notices.push(h('p', { class: 'notice new' }, h('b', { text: '🆕 2026/27改正。' }), '地域・都道府県の大会では、まだ2025/26版を使っている場合があります（遅くとも2027年4月1日までに適用）。大会要項で確認しましょう。'));
      if (q.badges.indexOf('provisional') >= 0) notices.push(h('p', { class: 'notice warn' }, h('b', { text: '⚠️ 監修前の暫定解答。' }), '懲戒（カード）の判断は、監修者の確認後に確定します。'));
      const rate = (k, label) => h('button', { type: 'button', class: 'rate' + (S.ratings[q.id] === k ? ' on' : ''), onClick: e => {
        S.ratings[q.id] = k; save();
        e.currentTarget.parentNode.querySelectorAll('.rate').forEach(x => x.classList.toggle('on', x === e.currentTarget));
        toast('ありがとうございます');
      } }, label);
      const card = h('div', { class: 'explain' },
        verdict,
        h('p', { class: 'ex-sum' }, rich(ex.summary)),
        is3d ? h('p', { class: 'ex-tip', text: '👆 上の視点ボタンで「副審の位置」「真横」に切り替えて、見え方の違いを確かめましょう。' }) : null,
        ex.detail ? h('details', { class: 'ex-detail', open: true }, h('summary', { text: 'くわしい解説' }), h('p', null, rich(ex.detail))) : null,
        notices,
        h('div', { class: 'refs' }, h('span', { class: 'muted', text: '根拠' }),
          q.refs.map(r => h('a', { class: 'ref', href: D.SRC[r.src].url, target: '_blank', rel: 'noopener' }, '📖 ' + r.article, h('small', { text: D.SRC[r.src].label })))),
        review ? null : h('div', { class: 'rating' }, h('span', { class: 'muted', text: 'この問題は、わかりやすかった？' }),
          h('div', { class: 'rate-row' }, rate('good', '👍 わかりやすい'), rate('hard', '🤔 わかりにくい'))));
      panel.appendChild(card);

      // ステージ：解説リプレイ
      stageWrap.classList.add('sticky');
      if (is3d) {
        engine.setAnalysis(true);
        unlockCams('side');
        st.speed = 0.5;
        btnSlow.setAttribute('aria-pressed', 'true');
        playExplain();
      } else {
        engine.setOverlays(ex.overlays || []);
        if (hasAnim) playExplain(); else engine.seek(0);
      }
      const last = S.idx >= S.order.length - 1;
      setAction(review ? '結果に戻る' : (last ? '結果を見る' : '次の問題へ →'), false, () => {
        if (review) { renderResult(); return; }
        S.idx++; save(); renderQuestion();
      });
      updateTools();
      requestAnimationFrame(() => {
        const head = document.querySelector('.qbar');
        const off = (head ? head.offsetHeight : 0) + (stageWrap.classList.contains('sticky') && getComputedStyle(stageWrap).position === 'sticky' ? stageWrap.offsetHeight : 0) + 8;
        const y = verdict.getBoundingClientRect().top + window.scrollY - off;
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
      });
      preload3d();
    }

    function skip() {
      S.results[q.id] = { skipped: true, at: Date.now() };
      S.idx++; save(); renderQuestion();
    }
    async function quit() {
      if (review) { renderResult(); return; }
      if (await confirmBox('中断してホームに戻りますか？ 進み具合は保存されます。', 'ホームへ', '続ける')) renderHome();
    }

    current = { destroy: () => { destroyed = true; if (engine) engine.destroy(); } };
    preload3d();
  }

  function preload3d() {
    if (!window.Scene3D) return;
    for (let i = S.idx; i < Math.min(S.order.length, S.idx + 3); i++) {
      if (QMAP[S.order[i]].kind === '3d') { window.Scene3D.preload().catch(() => {}); return; }
    }
  }

  /* ================================================= 結果画面 */
  function scoreRing(score, total) {
    const ns = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(ns, 'svg');
    s.setAttribute('viewBox', '0 0 120 120'); s.setAttribute('class', 'ring'); s.setAttribute('aria-hidden', 'true');
    const r = 52, c = 2 * Math.PI * r, k = total ? score / total : 0;
    s.innerHTML = '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#e3e8e3" stroke-width="12"/>' +
      '<circle class="ring-val" cx="60" cy="60" r="' + r + '" fill="none" stroke="#2e7d32" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c + '" transform="rotate(-90 60 60)" data-off="' + (c * (1 - k)) + '"/>';
    return s;
  }

  function renderResult() {
    teardown();
    const items = S.order.map(id => ({ q: QMAP[id], r: S.results[id] }));
    const counted = items.filter(i => i.r && !i.r.skipped);
    const score = counted.filter(i => i.r.ok).length, total = counted.length;
    const ratio = total ? score / total : 0;
    const msg = ratio >= 0.9 ? 'すばらしい！ 試合でも自信を持って判定できそうです。'
      : ratio >= 0.6 ? 'よくできました。間違えた問題の解説リプレイを、もう一度見ておきましょう。'
        : 'まずは解説リプレイで、動きと判定の関係をつかみましょう。何度でも挑戦できます。';
    const wrong = items.filter(i => i.r && !i.r.skipped && !i.r.ok).map(i => i.q.id);

    // カテゴリー別
    const cats = {};
    counted.forEach(i => { const c = cats[i.q.category] = cats[i.q.category] || { ok: 0, n: 0 }; c.n++; if (i.r.ok) c.ok++; });
    const catRows = Object.keys(cats).map(k => h('div', { class: 'cat-row' },
      h('span', { class: 'cat-name', text: D.CATEGORIES[k] }),
      h('span', { class: 'bar' }, h('i', { style: 'width:' + Math.round(cats[k].ok / cats[k].n * 100) + '%' })),
      h('span', { class: 'cat-num', text: cats[k].ok + '/' + cats[k].n })));

    const list = h('ul', { class: 'res-list' }, items.map(i => {
      const r = i.r;
      const mk = !r ? '–' : r.skipped ? '–' : r.ok ? '✓' : (r.n ? '△' : '✗');
      const cls = !r || r.skipped ? 'skip' : r.ok ? 'ok' : 'ng';
      return h('li', { class: cls },
        h('span', { class: 'mk', text: mk }),
        h('span', { class: 'rt' }, h('b', { text: i.q.title }), h('small', { text: D.CATEGORIES[i.q.category] + (r && r.total > 1 ? '・' + r.n + '/' + r.total : '') + (r && r.hint ? '・ヒント使用' : '') })),
        h('button', { type: 'button', class: 'btn ghost sm', onClick: () => mountQuestion(i.q, { review: true }) }, 'もう一度'));
    }));

    const notes = h('textarea', { class: 'notes-input', rows: '3', placeholder: '気づいたこと（例：○問目の動きが速すぎた、言葉が難しかった など）' });
    notes.value = S.notes || '';
    notes.addEventListener('input', () => { S.notes = notes.value; save(); });

    const screen = h('div', { class: 'screen result' },
      h('header', { class: 'qbar plain' },
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'ホームへ', onClick: () => renderHome() }, '×'),
        h('span', { class: 'count', text: '結果' })),
      h('main', { class: 'qmain' },
        h('div', { class: 'score' }, scoreRing(score, total),
          h('div', { class: 'score-num' }, h('strong', { text: String(score) }), h('span', { text: ' / ' + total })),
          h('p', { class: 'score-lv', text: LEVELS[S.level || 'beginner'].label + 'レベル' })),
        h('p', { class: 'score-msg', text: msg }),
        catRows.length ? h('div', { class: 'card' }, h('h2', { class: 'sec', text: '分野別' }), catRows) : null,
        h('div', { class: 'card' }, h('h2', { class: 'sec', text: '問題ごとの結果' }), list),
        h('div', { class: 'card tester' },
          h('h2', { class: 'sec', text: 'テスターの方へ' }),
          h('p', { class: 'muted', text: '試作版の改善に使います。気づいたことを書いて「結果と感想をコピー」を押し、LINEやメールで送ってください。' }),
          notes,
          h('button', { type: 'button', class: 'btn ghost', onClick: () => copyReport() }, '📋 結果と感想をコピー')),
        h('div', { class: 'res-actions' },
          wrong.length ? h('button', { type: 'button', class: 'btn primary', onClick: () => startRound(S.level, wrong, 'retry') }, '間違えた問題をもう一度（' + wrong.length + '問）') : null,
          h('button', { type: 'button', class: 'btn ghost', onClick: () => startRound(S.level) }, '最初からやり直す'),
          h('button', { type: 'button', class: 'btn ghost', onClick: () => renderHome() }, 'レベルを変える'))));
    app.appendChild(screen);
    scrollTopNow();
    requestAnimationFrame(() => setTimeout(() => {
      const v = screen.querySelector('.ring-val'); if (v) v.setAttribute('stroke-dashoffset', v.getAttribute('data-off'));
    }, 60));
    if (ratio >= 0.9 && total) { Sound.good(); buzz([20, 40, 20]); }
  }

  function copyReport() {
    const lines = ['【8人制審判クイズ 試作版 フィードバック】', 'レベル: ' + LEVELS[S.level || 'beginner'].label];
    S.order.forEach(id => {
      const r = S.results[id], q = QMAP[id];
      const m = !r ? '未' : r.skipped ? 'スキップ' : r.ok ? '○' : '×';
      const rate = S.ratings[id] === 'hard' ? '（わかりにくい）' : S.ratings[id] === 'good' ? '（わかりやすい）' : '';
      lines.push(id + ' ' + q.title + ': ' + m + rate);
    });
    lines.push('感想: ' + (S.notes || '（なし）'));
    lines.push('端末: ' + navigator.userAgent);
    const text = lines.join('\n');
    const done = () => toast('コピーしました');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
    else fallback();
    function fallback() {
      const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('コピーできませんでした'); }
      ta.remove();
    }
  }

  /* ================================================= 起動 */
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideGloss(); });
  // 監修・テスト用：#q=H-01&lv=grade4 で指定の問題を直接開く（記録しない復習モード）
  const m = location.hash.match(/q=([A-H]-\d{2})/);
  if (m && QMAP[m[1]]) {
    const l = location.hash.match(/lv=(beginner|grade4)/);
    if (l) S.level = l[1];
    if (!S.level) S.level = 'beginner';
    if (!S.order.length) S.order = D.QUESTIONS.map(q => q.id);
    mountQuestion(QMAP[m[1]], { review: true });
  } else renderHome();
})();
</script>
</body>
</html>
