# I-17 得点のときの副審
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング 2.副審「得点か得点でないか 得点があり、決定に疑問がないときであっても、主審と副審は目で確認し合わなければならない。
#       その後、副審は、旗を上げずに25〜30mタッチラインに沿いハーフウェーラインに向かってすばやく走らなければならない。
#       得点があったが、ボールが依然インプレーのように見えるとき、副審は先ず旗を上げて主審の注意をひかなければならない。
#       その後、通常の得点の手続きとして、25〜30mタッチラインに沿いハーフウェーラインに向かってすばやく走る」
#       ※25〜30mは11人制の記述。8人制のピッチ（長さ68m）での距離は監修で確認する
id: I-17
category: signals
badges: [provisional]
review: {status: draft, note: 走る距離（25〜30m）は11人制のガイドラインの記述です。8人制のピッチでの目安は監修で確認します。}
title: 得点のときの副審
kind: text
steps:
  - type: choice
    question: シュートがはっきりとゴールに入った。得点に疑問はない。副審は？
    choices:
      - id: flag
        text: 旗を上げて、主審に得点を知らせる
        feedback: 疑問のない得点では、旗は上げません。主審と目で確認し合ってから、ハーフウェーラインに向かって走ります。
      - {id: run, text: 主審と目で確認し合い、旗を上げずに、タッチラインに沿ってハーフウェーラインのほうへすばやく走る}
      - id: stay
        text: その場に立ったまま、旗を下ろしておく
        feedback: 得点を認めたことが分かるように、ハーフウェーラインのほうへすばやく走ります。
    answer: run
  - type: choice
    question: ボールはゴールラインを越えて得点になったが、ゴールポストに当たってフィールドに戻り、プレーが続いているように見える。副審は？
    choices:
      - id: run
        text: すぐにハーフウェーラインのほうへ走る
        feedback: プレーが続いているように見えるときは、まず旗を上げて主審の注意をひきます。走るのはそのあとです。
      - {id: flagFirst, text: まず旗を上げて主審の注意をひき、そのあと、ふつうの得点のときと同じようにハーフウェーラインのほうへ走る}
      - id: wave
        text: 旗を左右に振る
        feedback: 旗を振るのはファウルのときです。得点のときは、まず旗を上げて主審の注意をひきます。
    answer: flagFirst
explain:
  summary: 疑問のない得点では、主審と目で確認し合い、副審は旗を上げずにハーフウェーラインのほうへすばやく走ります。ボールがまだインプレーに見えるときは、まず旗を上げて主審の注意をひきます。
  detail: ガイドライン（11人制）では、タッチラインに沿って25〜30m走るとされています。得点にならず、そのままプレーが続くときも、主審と副審は目で確認し合います。
  overlays: []
refs:
