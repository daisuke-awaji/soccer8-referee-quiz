# I-15 旗を左右に振る（ファウル）
# 根拠: 第6条 その他の審判員「6. 副審のシグナル」の図（攻撃側のフリーキック／守備側のフリーキック）
#       JFA「審判員のための実践的ガイドライン」2.副審「ファウル 副審の間近や主審の見えないところでファウルまたは不正行為が行われたとき、副審は旗を上げなければならない。…
#       反則のシグナルをする前に、副審は次のことを判断しなければならない。・反則が主審の視野外にあったのか、または主審の視野が遮られていたのか。・主審がアドバンテージを適用するのかしないのか。
#       反則が発生したとき、…・シグナルするときに用いる手と同じ手で旗を上げることにより、主審にどちらの競技者にフリーキックを与えるのかを容易に示すことができる。・主審を目で確認する。
#       ・旗を左右に振る（過度に、または強く振ることは避ける）」
id: I-15
category: signals
badges: []
review: {status: draft}
title: 旗を左右に振る
kind: signal
figure: {pose: ar.wave}
steps:
  - type: choice
    question: 副審の目の前で反則があった。主審からは、ほかの競技者に隠れて見えていなかった。副審が旗を上げて、左右に振っています。何を知らせている？
    choices:
      - {id: foul, text: ファウル（反則）があったこと}
      - id: off
        text: オフサイド
        feedback: オフサイドのときは、旗を真上に上げます。
      - id: sub
        text: 交代の申し出
        feedback: 交代の合図は、旗を両手で頭の上に横にします。
    answer: foul
  - type: choice
    question: 旗を振る前に、副審が判断しておくことは？
    choices:
      - id: num
        text: 反則した競技者の背番号
        feedback: 背番号はあとで主審に伝えることがありますが、旗を上げる前に判断するのは「主審から見えていたか」と「アドバンテージか」です。
      - {id: two, text: 反則が主審から見えていなかったか（視野が遮られていたか）と、主審がアドバンテージを適用するかどうか}
      - id: time
        text: 試合の残り時間
        feedback: 残り時間は関係ありません。
    answer: two
  - type: choice
    question: ファウルを知らせるとき、副審はどちらの手で旗を上げる？
    choices:
      - id: right
        text: いつも右手
        feedback: いつも右手で上げるのは、オフサイドやゴールラインを越えたときです。ファウルのときは、フリーキックの方向を示す手で上げます。
      - {id: dir, text: このあとフリーキックの方向を示す手（どちらのチームのフリーキックかが分かる）}
      - id: near
        text: 主審から遠いほうの手
        feedback: 旗は主審から見えるようにします。フリーキックの方向を示す手で上げると、どちらのチームのフリーキックかがすぐ分かります。
    answer: dir
explain:
  summary: 副審の間近や、主審から見えないところでファウルがあったとき、副審は旗を上げて左右に振ります。旗は、フリーキックの方向を示す手で上げます。
  detail: 旗を振る前に、主審から見えていなかったか、主審がアドバンテージを適用するかを判断します。反則されたチームがアドバンテージで利益を得たときは、旗を上げません（ウェイトアンドシー）。振るときは主審を目で確認し、過度に強く振らないようにします。
  overlays: []
refs:
  - {src: laws, article: 第6条 その他の審判員 6.副審のシグナル（フリーキック）}
