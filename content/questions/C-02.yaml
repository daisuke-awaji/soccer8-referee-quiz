steps:
  - type: choice
    question: 5秒のカウントダウンが終わっても、GKはゴールキックを蹴りません。再開方法は？
    choices:
      - {id: ck, text: 相手チーム（赤）のコーナーキック}
      - id: ifk
        text: 赤チームの間接フリーキック
        feedback: 2026/27版では、ゴールキックを遅らせた場合は相手チームのコーナーキックです。
      - id: ycretake
        text: GKに警告し、ゴールキックをやり直す
        feedback: まず相手チームのコーナーキックになります。警告は、その後も過度に遅らせた場合だけです。
      - id: ckyc
        text: 赤チームのコーナーキック＋GKに警告
        feedback: 再開方法は正しいですが、カウントダウンを過ぎただけでは警告しません。警告は、コーナーキックになった後も過度に遅らせた場合です。
    answer: ck
explain:
  summary: ゴールキックを不当に遅らせると、5秒のカウントダウンの後、相手チームのコーナーキックになります。
  detail: GKが手や腕でボールを8秒を超えてコントロールした場合も、相手チームのコーナーキックです（主審は残り5秒を合図でカウントします）。「時間かせぎ → 相手のチャンス」と覚えると整理しやすいです。
  overlays: []
