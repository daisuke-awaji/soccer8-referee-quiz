steps:
  - type: placement
    question: 右側の副審を、タッチライン沿いにドラッグ（またはタップ）して、ゴールキックのときに最初に立つ位置に動かしてください。
    placement:
      mode: line
      actor: AR2
      fixedY: 51.4
      min: 34.5
      max: 68
      target: [64, 51.4]
      tolerance: 1.5
      describe: {kind: lineOffset}
      zones:
        - lineX: 54
          r: 1.5
          text: そこは後方から2人目の守備側競技者のラインです。ボールが正しく置かれたことを確かめたあとに、オフサイドラインへ移ります。
        - lineX: 56
          r: 0.5
          text: そこはペナルティーエリアのラインです。まずは、ボールがゴールエリアの中にあるかを確かめられる位置に立ちます。
        - lineX: 68
          r: 1.5
          text: そこはゴールラインの延長上（コーナーキックのときの位置）です。ゴールキックでは、ゴールエリアのラインに合わせます。
explain:
  summary: ゴールキックでは、副審はまずボールがゴールエリアの中に正しく置かれているかを確かめます。そのため、ゴールエリアのラインの延長上に立ちます。
  detail: ボールが正しく置かれていなければ、その位置から動かず、主審と目で確認して旗を上げます。正しく置かれていれば、オフサイドラインをチェックできる位置（{{後方から2人目の守備側競技者}}のライン）へ移ります。8人制のゴールエリアは、ゴールラインから4mです。
  overlays:
    - {type: marker, at: [64, 51.4], label: ゴールエリアのライン}
    - {type: offsideLine, actor: B4, label: このあと移るライン}
