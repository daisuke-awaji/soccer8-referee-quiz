# E-05 ゴールキックのときの副審の位置
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング 2.「ゴールキック 副審は、先ずボールがゴールエリア内にあるかどうかチェックしなければならない。
#       ボールが正しく置かれていない場合、副審はそのポジションから動かず、主審とアイコンタクトを取り、旗を上げなければならない。
#       しかしながら、追加副審がいる場合、副審はオフサイドのラインに位置すべきである。追加副審はゴールラインとゴールエリアの交点のところに位置し…」
#       ※「ボールがゴールエリア内にあるかを確かめられる位置」＝ゴールエリアのラインの延長上とした。監修で確認する
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
