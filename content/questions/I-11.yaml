# I-11 指を開いたカウントダウン
# 根拠: 第5条 主審「6. 主審のシグナル」の図「ボールをコントロールすることに対する8秒制限の残り5秒をカウントダウンする」
#       第12条 2.間接フリーキック「ゴールキーパーが自分のペナルティーエリア内で、ボールを放すまでに手や腕で8秒を超えてコントロールした場合、コーナーキックが与えられる」
#       「主審は、いつゴールキーパーがボールをコントロールして8秒が始まるかを判断し、そして手を上げて目で見て分かるように最後の5秒をカウントダウンする」
id: I-11
category: signals
badges: []
review: {status: draft}
title: 指を開いたカウントダウン
kind: signal
figure: {pose: ref.countdown}
steps:
  - type: choice
    question: GKが自分のペナルティーエリアの中で、ボールを手で持っている。主審が片手を上げ、指を開いてカウントダウンを始めた。何のカウントダウン？
    choices:
      - id: six
        text: GKがボールを持てる6秒の、残り5秒
        feedback: GKがボールを手で持てるのは8秒です。主審は、その最後の5秒をカウントダウンします。
      - {id: eight, text: GKがボールを持てる8秒の、残り5秒}
      - id: five
        text: GKがボールを持てる5秒の、残り5秒
        feedback: GKがボールを手で持てるのは8秒です。主審は、その最後の5秒をカウントダウンします。
    answer: eight
  - type: choice
    question: カウントダウンが終わっても、GKはボールを手で持ったままだった（8秒を超えた）。再開の方法は？
    choices:
      - id: ifk
        text: 相手チームの間接フリーキック
        feedback: 間接フリーキックではありません。8秒を超えたら、相手チームのコーナーキックです。
      - {id: ck, text: 相手チームのコーナーキック}
      - id: yc
        text: GKに警告して、ドロップボール
        feedback: 警告もドロップボールもありません。相手チームのコーナーキックで再開します。
    answer: ck
explain:
  summary: GKが手でボールを持てるのは8秒です。主審は、手を上げて目で見て分かるように最後の5秒をカウントダウンし、超えたら相手チームのコーナーキックです。
  detail: いつ8秒が始まるか（GKがボールをコントロールしたか）は主審が判断します。2026/27版では、スローインとゴールキックをわざと遅らせたときにも、主審が5秒のカウントダウンをするようになりました。
  overlays: []
