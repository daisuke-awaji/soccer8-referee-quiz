# G-02 グリーンカード
# 根拠: 8人制「グリーンカード」（P.5）。「怪我をした者を助け合う」などのリスペクトある行動に示す。注意点「試合の流れを止めない」「ポジティブな行動の意図を見極める」「躊躇せずに示す」「誰に示されたのか分かりやすいように」「声やジェスチャーのみでほめたたえるのもよい」
id: G-02
category: foul
badges: []
review: {status: draft}
title: 相手を気づかってボールを外に出した
kind: text
steps:
  - type: choice
    question: 相手の競技者が倒れて痛がっているのに気づき、ボールを持っていた選手が自分からタッチラインの外へ蹴り出しました。8人制で、主審がこの行動に示せるカードは？
    choices:
      - id: green
        text: グリーンカード
      - id: yellow
        text: イエローカード
        feedback: イエローカードは警告です。相手を気づかう行動は、たたえる対象です。
      - id: none
        text: 示すカードはない
        feedback: 8人制では、このようなリスペクトある行動に、主審はグリーンカードを示します。
    answer: green
  - type: choice
    question: グリーンカードを示すときの注意として、8人制競技規則に書かれていないものはどれ？
    choices:
      - id: flow
        text: 試合の流れを止めない
        note: 規則にある
        feedback: これは規則に書かれている注意点です。
      - id: who
        text: 誰に示したのか分かりやすいようにする
        note: 規則にある
        feedback: これは規則に書かれている注意点です。
      - id: stop
        text: 必ずプレーを止めてから示す
        note: 規則にない
    answer: stop
explain:
  summary: 8人制では、相手を気づかうなどのリスペクトある行動に、主審はグリーンカードを示します。
  detail: 8人制競技規則では「怪我をした者を助け合う」「対戦相手、チーム関係者、審判員を大切に思う」などの行動にグリーンカードを示すとしています。示すときの注意点は、試合の流れを止めない、ポジティブな行動の意図を見極める、躊躇せずに示す、誰に示されたのか分かりやすいように、の4つで、声やジェスチャーだけでほめたたえるのもよいとされています。
  overlays: []
