# H-04 クロスの前、ペナルティーエリアの中で押した（主審の立ち位置を選ぶ）
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング「求められるべきポジショニング」
#   ・主審とプレーが行われている側の副審でプレーを挟む。
#   ・主審は、通常、幅広い対角線式審判法を用い、プレーが行われている側の副審が自分の視野に入るようにする。
#   ・主審は、プレーの外側に向かって位置することによって、プレーとプレーが行われている側の副審を容易に視野に入れることができる。
#   ・主審は、プレーを妨害することなく、十分にプレーに近づく。
# 競技規則 第12条（押す → 直接FK）、第14条（自分のPA内で直接FKとなる反則 → PK）
# 候補の位置（at）は 2D と同じフィールド座標（x=0〜68, y=0〜50。副審は y=0 側のタッチライン）。
# 候補ごとの見え方（押した手が見えるか・副審が視野に入るか・プレーのじゃまにならないか）は
# src/scene3d/scenes/penaltyAreaPushMotion.ts の viewCheck() で計算し、単体テストで正解と一致することを確かめる。
id: H-04
category: positioning
badges:
  - provisional
review: {status: draft, note: 8人制のフィールドに当てはめた具体的な立ち位置（候補の位置）は、監修者の確認待ち}
title: クロスが上がる。主審はどこに立つ？
kind: 3d
hint: 押し合いが見えて、副審も目に入る位置はどこでしょう？
scene3d:
  id: penaltyAreaPush
  pauseAt: 2.4
  endAt: 4.6
  contactAt: 3.3
  captions:
    - {t: 0, text: 赤7番がサイドをドリブル。ゴール前では、青3番が赤9番について走る}
    - {t: 2.2, text: クロスが上がりそう}
    - {t: 2.7, text: クロス}
    - {t: 3.45, text: 赤9番が倒れた}
  tip: 上の視点を「Aから」〜「Dから」に切り替えると、立ち位置による見え方の違いを確かめられます。「全体」では、正しい位置（C）からの視野を黄色で示しています。
steps:
  - type: position
    question: クロスが上がりそうです。主審のあなたは、どこに立ちますか？
    candidates:
      - id: A
        at: [54, 4]
        text: 副審と同じ側。タッチラインの近く
        feedback: 押した手は見えますが、副審が真横になり、視野に入りません。副審と同じ側からでは、プレーを「挟む」ことができず、副審の旗にも気づけません。
      - id: B
        at: [52, 22.7]
        text: ペナルティーエリアの正面。プレーの真後ろ
        feedback: 青3番の背中に隠れて、押した手が見えません。プレーの真後ろからは、選手どうしが重なって見えます。副審も視野に入りません。
      - id: C
        at: [54, 35]
        text: ペナルティーエリアの外。副審と反対側の斜め
      - id: D
        at: [61, 19]
        text: ペナルティーエリアの中。プレーのすぐそば
        feedback: 近すぎて、クロスのボールのコースに入ってしまいます。副審も視野に入りません。プレーのじゃまにならない範囲で近づきます。
    answer: C
  - type: choice
    question: 正しい立ち位置（C）から、もう一度見ます。判定は？
    choices:
      - {id: pk, text: ペナルティーキック}
      - id: dfk
        text: 赤チームの直接フリーキック
        feedback: 押すのは{{直接フリーキック}}の反則です。守備側の青3番が、自分のペナルティーエリアの中で行ったので、ペナルティーキックになります。
      - id: ifk
        text: 赤チームの間接フリーキック
        feedback: 押すのは{{直接フリーキック}}の反則です（間接フリーキックではありません）。自分のペナルティーエリアの中なので、ペナルティーキックです。
      - id: none
        text: ノーファウル（赤9番が自分で倒れた）
        feedback: C から見ると、青3番が両手で赤9番の背中を押しています。
    answer: pk
explain:
  summary: 主審は、プレーの外側に立ち、プレーが行われている側の副審とでプレーを挟みます（C）。押した手が見え、副審も視野に入ります。青3番が自分のペナルティーエリアの中で赤9番を押したので、ペナルティーキックです。
  detail: JFA の「審判員のための実践的ガイドライン」には、「主審とプレーが行われている側の副審でプレーを挟む」「プレーが行われている側の副審が自分の視野に入るようにする」「プレーの外側に向かって位置することによって、プレーと副審を容易に視野に入れることができる」「プレーを妨害することなく、十分にプレーに近づく」とあります。A（副審と同じ側）では副審が視野に入らず、B（プレーの真後ろ）では押した手が青3番の背中に隠れ、D（すぐそば）ではボールのコースに入ってしまいます。副審が視野に入っていれば、主審から見えないところの反則も、副審の旗で知ることができます。8人制のフィールド（68m×50m、ペナルティーエリア 12m）に当てはめた具体的な位置は、監修前の暫定です。
  overlays: []
refs:
  - {src: guidelines, article: ポジショニング（求められるべきポジショニング）}
  - {src: laws, article: 第12条 ファウルと不正行為（直接フリーキック：押す）}
  - {src: laws, article: 第14条 ペナルティーキック}
