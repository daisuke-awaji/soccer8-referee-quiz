# H-01 横からのスライディングタックル
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
id: H-01
category: foul3d
badges:
  - provisional
review: {status: draft, note: 懲戒（ステップ3）の正解は監修者の確認待ち}
title: 横からのスライディングタックル
kind: 3d
hint: 足が当たった瞬間、ボールはどこにありましたか？
scene3d:
  id: slidingTackle
  pauseAt: 2.7
  endAt: 3.6
  contactAt: 1.6
  captions:
    - {t: 0, text: 赤10番がドリブルで前へ。ペナルティーエリアの外}
    - {t: 0.9, text: 青4番が横からスライディング}
    - {t: 1.75, text: 赤10番が倒れた}
steps:
  - type: choice
    question: 主審の位置から見たタックルです。ファウルですか？
    choices:
      - id: nofoul
        text: ノーファウル（ボールに向かった正当なタックル）
        feedback: 主審の位置からは、足とボールが重なって「ボールに行った」ように見えます。でも、足が当たったとき、ボールはすでに2m以上前にありました。
      - {id: foul, text: ファウル}
    answer: foul
  - type: choice
    question: 再開方法は？
    choices:
      - {id: dfk, text: 赤チームの直接フリーキック}
      - id: ifk
        text: 赤チームの間接フリーキック
        feedback: 相手をつまずかせる・蹴るなど、相手競技者との接触を伴う反則は{{直接フリーキック}}です。
      - {id: pk, text: ペナルティーキック, feedback: 反則があった位置は、ペナルティーエリアの外です。}
      - id: db
        text: ドロップボール
        feedback: 反則があったので、反則をされた側のフリーキックで再開します。
    answer: dfk
  - type: choice
    question: 懲戒はどうしますか？
    choices:
      - id: none
        text: なし（不用意なファウル）
        feedback: ボールがなくなった後に、足裏を向けて勢いよく滑り込んでいます。相手への危険をかえりみない「無謀」と考えるのが妥当です（暫定）。
      - {id: yc, text: 警告（無謀なファウル）}
      - id: rc
        text: 退場（著しく不正なプレー）
        feedback: 足は低く、片足で、スピードも極端ではありません。「過剰な力」とまではいえないと考えます（暫定）。
    answer: yc
explain:
  summary: ボールがすでに離れた後の、遅れたタックルです。相手の足に当たっているのでファウル、ペナルティーエリアの外なので直接フリーキックです。
  detail: 見る角度で印象が変わることを、視点を切り替えて確かめてください。主審の位置（後方）からは、足・ボール・相手が一直線に重なり、ボールに行ったように見えます。副審の位置からは、足裏が相手のすねに向いているのが見えます。真横からは、接触したときボールが2m以上前にあったことが分かります。だから主審は、副審とでプレーを挟む位置をとって死角をなくします。懲戒の判断（{{不用意}}／{{無謀}}／{{著しく不正なプレー}}）は、監修前の暫定解答です。
  overlays: []
refs:
  - {src: laws, article: 第12条 ファウルと不正行為}
