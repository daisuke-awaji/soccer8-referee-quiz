explain:
  summary: スローインを不当に遅らせているとき、主審は笛を吹き、手を上げて5秒をカウントダウンします。5秒を過ぎたら相手チームのスローインです。
  detail: 警告するのは、相手チームのスローインになった後も過度に再開を遅らせた場合だけです。ゴールキックにも同じようなカウントダウンがあります（次の問題）。
