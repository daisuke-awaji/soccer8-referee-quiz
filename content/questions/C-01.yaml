steps:
  - type: choice
    question: 主審の5秒のカウントダウンが終わっても、赤3番はスローインをしません。どうなりますか？
    choices:
      - {id: blue, text: 相手チーム（青）のスローインになる}
      - id: ycred
        text: 赤3番に警告し、赤チームのスローインでやり直す
        feedback: 2026/27版では、まず相手チームのスローインになります。警告するのは、その後も過度に再開を遅らせた場合だけです。
      - id: ifk
        text: 青チームの間接フリーキックになる
        feedback: スローインを遅らせた場合の再開は、相手チームのスローインです。
      - id: wait
        text: 何もせず、スローインを待つ
        feedback: カウントダウンが終わったら、相手チームのスローインにします。待ち続ける必要はありません。
