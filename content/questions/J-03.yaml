# J-03 試合時間とハーフタイム
# 根拠: 8人制 第7条 試合時間 ①前、後半それぞれ15〜20分間を標準とする（年代によって変更できる。赤字） ②ハーフタイムのインターバルは、10分間を超えない（黒字）（P.4）
id: J-03
category: matchTime
levels: [beginner, grade4]
badges: []
review: {status: draft}
title: 試合時間とハーフタイム
kind: text
steps:
  - type: choice
    question: 8人制の試合時間の標準は？（前半・後半それぞれ）
    choices:
      - id: m10
        text: 10〜12分
        feedback: 8人制競技規則の標準は、前後半それぞれ15〜20分です（年代によって変えられます）。
      - id: m15
        text: 15〜20分
      - id: m45
        text: 45分
        feedback: 45分は11人制（大人）の試合時間です。
    answer: m15
  - type: choice
    question: ハーフタイムのインターバルは？
    choices:
      - id: free
        text: 決まりはない（大会ごとに自由に決める）
        feedback: ハーフタイムは「10分間を超えない」と決められています。
      - id: m15
        text: 15分を超えない
        feedback: 15分は11人制のハーフタイムです。8人制は10分を超えません。
      - id: m10
        text: 10分を超えない
    answer: m10
explain:
  summary: 8人制の試合時間は、前後半それぞれ15〜20分が標準です。ハーフタイムは10分を超えません。
  detail: 8人制競技規則 第7条の規定です。試合時間は年代によって変えられます（大会ごとに変えられる規則）。ハーフタイムのインターバルが10分を超えないことは、必ず守る規則です。11人制は、前後半それぞれ45分、ハーフタイムは15分を超えない、です。
