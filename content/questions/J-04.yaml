explain:
  summary: 3ピリオド制では、3ピリオド目の中間でエンドを替えます。そのときインターバルはとりません。
  detail: 8人制競技規則 第7条③の規定で、大会ごとに採用できる規則（規則書の赤字）です。規則書の図では、1ピリオドと2ピリオド、2ピリオドと3ピリオドの間にインターバルがあり、そこでもエンドを替えています。3ピリオド目の中間でも替えることで、両チームが同じ時間ずつ両方のエンドを攻めることになります。「8人制サッカーと11人制サッカーの違い」の表では、12分間のピリオドを3回としています。
