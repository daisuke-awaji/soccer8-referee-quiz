# J-04 3ピリオド制
# 根拠: 8人制 第7条③ 3ピリオド制を採用することができる。その場合、3ピリオド目の中間時点で両チームが攻めるエンドを替える。インターバルはとらない（P.4、赤字）
#       P.4 の図: 1ピリオド・インターバル・2ピリオド・インターバル・3ピリオド。インターバルごとと、3ピリオド目の中間にエンドを替える記号がある
