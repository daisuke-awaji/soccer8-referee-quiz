explain:
  summary: すね当ては必ず着けます。靴は種類を問いません。眼鏡は、主審が安全と判断すれば着けられます。
  detail: 8人制競技規則 第4条では、競技者は靴を履く必要があるが種類は問わない（④）、すね当てを着用する（⑤）、眼鏡は主審が安全であると判断したものは着用できる（⑦）、と定めています。用具は、その競技者と相手競技者にとって安全なものでなければなりません（⑥）。
  overlays: []
