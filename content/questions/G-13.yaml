steps:
  - type: choice
    question: 味方のスローインを、GKが直接手で受けました。どう判定しますか？
    choices:
      - id: play
        text: 反則ではない。プレーを続ける
        feedback: 味方がスローインしたボールを直接受けた場合、GKは自分のペナルティーエリアの中でも手で扱えません。
      - {id: ifk, text: 赤チームの間接フリーキック}
      - id: retake
        text: 青チームのスローインをやり直す
        feedback: スローインは正しく行われています。反則は「GKが手で受けたこと」です。
      - id: redthrow
        text: 赤チームのスローイン
        feedback: 投げ方の反則ではありません。GKの反則なので、相手チームの間接FKです。
    answer: ifk
  - type: choice
    question: もしGKが手を使わず、足でボールを止めてそのまま足でプレーしていたら？
    choices:
      - {id: play, text: 反則ではない。プレーを続ける}
      - id: ifk
        text: 赤チームの間接フリーキック
        feedback: 制限されているのは、手や腕で扱うことです。足でプレーするのは自由です。
    answer: play
explain:
  summary: 味方のスローインを直接受けたボールを、GKが自分のペナルティーエリアの中で手で扱うと、相手チームの{{間接フリーキック}}です。
  detail: 味方が足でけって返したボール（{{バックパス}}）と同じ扱いで、懲戒はありません。どちらの場合も、GKが足でプレーするのはかまいません。また、相手チームのスローインのボールなら、GKは手で取れます。
  overlays:
    - {type: zone, x1: 56, x2: 68, y1: 10.5, y2: 39.5, label: ペナルティーエリア}
