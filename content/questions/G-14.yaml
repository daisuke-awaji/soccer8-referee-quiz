explain:
  summary: 味方が頭や胸、膝で返したボールは、GKが手で扱っても反則ではありません。
  detail: 反則になるのは、①味方が意図的に足でけったボール（{{バックパス}}）、②味方のスローインを直接受けたボール、をGKが自分のペナルティーエリアの中で手で扱った場合です。ただし、規則の裏をかくために、わざと足でボールを浮かせてから頭でGKに返すようなトリックは反則です（警告と間接FK）。
  overlays:
    - {type: zone, x1: 56, x2: 68, y1: 10.5, y2: 39.5, label: ペナルティーエリア}
