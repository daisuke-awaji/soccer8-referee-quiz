# I-14 ゴールラインを越えたときの副審
# 根拠: JFA「審判員のための実践的ガイドライン」2.副審「コーナーキック／ゴールキック
#       ボールの全体がゴールラインを越えたとき、（良い視野を得るため）副審は右手で旗を上げ、次のように主審にボールがアウトオブプレーであることを伝える。
#       ・副審から近い場合－ゴールキックかコーナーキックかを示す。・副審から遠い場合－主審を目で確認して主審の判定にあわせる。
#       ボールがゴールラインを明らかに越えたとき、副審は旗を上げてボールが競技のフィールドから出たことを示す必要はない。
#       ゴールキックかコーナーキックかの判定がはっきりしている場合、特に主審がシグナルをしているときは、副審がシグナルをする必要はない」
id: I-14
category: signals
badges: []
review: {status: draft}
title: ゴールラインを越えたときの副審
kind: text
steps:
  - type: choice
    question: ボールの全体がゴールラインを越えた。副審が、ボールが出たことを主審に伝えるために旗を上げるのは、どちらの手？
    choices:
      - id: left
        text: 左手
        feedback: 良い視野を得るため、右手で上げます。
      - {id: right, text: 右手}
      - id: any
        text: どちらでもよい
        feedback: ボールがゴールラインを越えたときは、良い視野を得るため右手で上げます。
    answer: right
  - type: choice
    question: ボールが明らかにゴールラインを越え、主審がゴールキックの合図をしている。それでも副審は、必ず旗で合図する。
    choices:
      - id: o
        text: 正しい
        feedback: ゴールキックかコーナーキックかがはっきりしていて、特に主審が合図をしているときは、副審が合図をする必要はありません。
      - {id: x, text: 誤り}
    answer: x
  - type: choice
    question: 副審から遠いところでボールがゴールラインを越えた。副審は、主審を目で確認して、主審の判定に合わせる。
    choices:
      - {id: o, text: 正しい}
      - id: x
        text: 誤り
        feedback: 副審から近いときは、ゴールキックかコーナーキックかを示します。遠いときは、主審を目で確認して主審の判定に合わせます。
    answer: o
explain:
  summary: ボールの全体がゴールラインを越えたとき、副審は右手で旗を上げます。近いときはゴールキックかコーナーキックかを示し、遠いときは主審の判定に合わせます。明らかなときは合図をしなくてかまいません。
  detail: 合図が多すぎると、本当に大切な合図が目立たなくなります。主審と副審は、合図の前に目で確認し合います。
  overlays: []
