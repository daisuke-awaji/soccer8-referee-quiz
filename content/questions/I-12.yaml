# I-12 笛を吹く再開・吹かない再開
# 根拠: JFA「審判員のための実践的ガイドライン」ボディーランゲージ、コミュニケーションと笛 1.主審「笛」
#       必要: キックオフ／FK・PKでの停止／規定の距離を下げたFK・PKでの再開／警告・退場・負傷・交代のあとの再開
#       不要: GK・CK・スローイン・得点での停止／ほとんどのFK・GK・CK・スローイン・ドロップボールでの再開
id: I-12
category: signals
badges: []
review: {status: draft}
title: 笛を吹く再開・吹かない再開
kind: text
steps:
  - type: choice
    question: 次のうち、再開のときに笛を吹く必要がないのはどれ？
    choices:
      - id: pk
        text: ペナルティーキック
        feedback: ペナルティーキックは、笛の合図で再開します。
      - id: dist
        text: 相手を規定の距離（7m）まで下げさせたフリーキック
        feedback: 距離を下げさせたフリーキックは、笛の合図で再開します。キッカーにも「笛を待つように」とはっきり伝えます。
      - id: card
        text: 警告（イエローカード）を示したあとの再開
        feedback: 警告・退場・負傷者・交代でプレーを止めたあとは、笛で再開します。
      - {id: ti, text: スローイン}
    answer: ti
  - type: choice
    question: ボールがタッチラインを越えて出た。プレーを止めるために、主審は必ず笛を吹く。
    choices:
      - id: o
        text: 正しい
        feedback: ゴールキック・コーナーキック・スローイン・得点でプレーが止まるときは、笛を吹く必要はありません。合図で再開の方法を示します。
      - {id: x, text: 誤り}
    answer: x
explain:
  summary: スローイン・ゴールキック・コーナーキックは、止めるときも再開するときも、ふつうは笛を吹きません。笛が必要なのは、反則でプレーを止めるとき、ペナルティーキック、距離を下げさせたフリーキック、警告・退場・負傷・交代のあとの再開などです。
  detail: 不必要な笛を多く吹きすぎると、本当に必要なときに効き目が薄れます。キックオフ（前後半の開始と得点のあと）も笛で始めます。
  overlays: []
refs:
