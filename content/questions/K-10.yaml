# K-10 相手の陣地にいたままキックオフ
# 根拠: 競技規則 第8条 1. キックオフ「すべてのキックオフにおいて、キックオフを行う競技者を除いて、すべての競技者は、
#       競技のフィールドの自分たちのハーフ内にいなければならない」
#       反則と罰則「キックオフの進め方に対して、その他の反則があった場合、キックオフを再び行う」
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
