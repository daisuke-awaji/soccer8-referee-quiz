steps:
  - type: choice
    question: 青8番が、相手の陣地（赤の陣地）にいたままキックオフが行われました。主審はプレーを止めました。どう再開しますか？
    choices:
      - {id: retake, text: キックオフをやり直す}
      - id: ifk
        text: 赤チームの間接フリーキック
        feedback: キックオフの進め方の違反（自分の陣地にいなかった）は、フリーキックではなく、キックオフのやり直しです。
      - id: drop
        text: ドロップボール
        feedback: 第8条で、キックオフの進め方に反則があったときは、キックオフを再び行うと決められています。
      - id: blue
        text: 青チームのキックオフ
        feedback: キックオフをするのは、もともとの赤チームです。同じチームがやり直します。
    answer: retake
explain:
  summary: キックオフのとき、キッカー以外の競技者は全員が自分の陣地にいなければなりません。違反があれば、キックオフをやり直します。
  detail: 第8条では、キックオフを行う競技者を除き、すべての競技者が自分たちのハーフ内にいなければならないと定めています。キックオフの進め方に反則があった場合は、キックオフを再び行います。こうならないように、主審は笛の前に両チームの位置を確かめます（K-07）。なお、キッカーがほかの競技者より先に2回続けてボールに触れた場合は、相手チームの間接フリーキックです。
  overlays:
    - {type: zone, x1: 0, x2: 34, y1: 0, y2: 50, label: 赤の陣地}
