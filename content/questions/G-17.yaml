steps:
  - type: placement
    question: 赤チームの間接フリーキックです。ボールを置く位置をタップしてください。
    placement:
      mode: free
      marker: ボール
      target: [64, 22.3]
      tolerance: 1.2
      describe: {kind: distanceFromGoalLine, answerText: 4m（ゴールエリアのライン上）}
      zones:
        - at: [66.2, 22.3]
          r: 1.3
          text: そこは反則の起きた地点です。相手チームのゴールエリアの中の反則で攻撃側に間接FKが与えられたときは、ゴールエリアのライン上から行います。
        - at: [60, 25]
          r: 1.2
          text: そこはペナルティーマークです。PKではありません。
        - lineX: 64
          r: 1.2
          text: ゴールエリアのライン上なのは正しいです。ただし、反則の起きた地点に最も近いところに置きます。
  - type: choice
    question: ボールからゴールラインまでは4mしかありません。青チームの選手は、どこなら7mより近くに立てますか？
    choices:
      - {id: goalline, text: 自分のゴールポストの間のゴールライン上}
      - id: area
        text: ゴールエリアの中なら、どこでも
        feedback: 7mより近くに立てるのは、自分のゴールポストの間のゴールライン上だけです。
      - id: nowhere
        text: どこにも立てない
        feedback: 自分のゴールポストの間のゴールライン上なら、7mより近くに立てます。
    answer: goalline
  - type: choice
    question: 赤チームのキックが、誰にも触れずに直接ゴールに入りました。
    choices:
      - id: goal
        text: 得点
        feedback: 間接フリーキックは、ほかの競技者が触れないと得点になりません。
      - {id: gk, text: 青チームのゴールキック}
      - id: retake
        text: キックをやり直す
        feedback: 主審が間接の合図（片腕を上げる）をしていれば、やり直しにはなりません。ゴールキックです。
    answer: gk
explain:
  summary: 相手チームのゴールエリアの中の反則で攻撃側に{{間接フリーキック}}が与えられたら、反則の起きた地点に最も近い、ゴールラインに平行なゴールエリアのライン上から行います。
  detail: 8人制のゴールエリアは、ゴールポストの内側から4mです。守備側はボールから7m以上離れますが、自分のゴールポストの間のゴールライン上なら近くに立てます。間接フリーキックが誰にも触れずに相手ゴールに入った場合は、ゴールキックです（主審が間接の合図を怠っていた場合は、やり直し）。
  overlays:
    - {type: zone, x1: 64, x2: 68, y1: 18.5, y2: 31.5, label: ゴールエリア}
    - {type: marker, at: [64, 22.3]}
    - {type: ruler, from: [68, 16.5], to: [64, 16.5], label: 4m}
