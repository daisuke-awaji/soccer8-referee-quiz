# G-17 ゴールエリアの中で、バックパスを手で取った
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
# 根拠: 第13条2 進め方（相手チームのゴールエリア内の反則で攻撃側の間接FK → 最も近い、ゴールラインに平行なゴールエリアのライン上）
#       第13条2（自分のゴールポスト間のゴールライン上に立つ場合を除き、ボールから離れる）／第13条1（間接FKが直接相手ゴールに入ったらゴールキック。合図を怠ったらやり直し）
#       8人制 第1条（ゴールエリアはゴールポストの内側から4m）・第13条（7m）
