steps:
  - type: choice
    question: 握手のとき、ふつう動くのはどちらのチームですか？（全員が画面の左を向いています）
    choices:
      - {id: left, text: 主審から見て左手側のチーム（赤）が動き、審判員と相手チームの前を通って握手する}
      - id: right
        text: 主審から見て右手側のチーム（青）が動き、審判員と相手チームの前を通って握手する
        feedback: 大阪府サッカー協会のマニュアルでは、通常は「主審の左手側」のチームが動くとしています。左を向いた主審の左手側は、画面の下の赤チームです。
      - id: refs
        text: 審判員だけが動き、両チームの選手と順番に握手する
        feedback: 審判員は動かずに待ちます。片方のチームが移動して、審判員と相手チームに握手していきます。
    answer: left
explain:
  summary: 挨拶のあと、片方のチーム（通常は主審の左手側）が移動して、審判員と相手チームと握手します。
  detail: 大阪府サッカー協会のマニュアルの手順です。動いたチームが全員と握手を終えたら、主審が両チームのキャプテンを呼んでコイントスを行います。どちらのチームが動くかは、大会の運営で決まっていることもあります。
  overlays: []
