# K-02 挨拶のあとの握手
# 根拠: 大阪府サッカー協会「初心者のためのレフェリーズマニュアル」試合の進行 P.9（PDF 11ページ）
#       「入場 ②片方のチーム（通常は主審の左手側）のチームが移動し審判団および相手チームと握手を行う ③主審が両チームのキャプテンを呼んでトスを行う」
# 画面では、全員がベンチ側（左）を向いている。主審の左手側は画面の下（x が小さい側）＝赤チーム
