steps:
  - type: choice
    question: 壁はボールから約5m。主審はどうしますか？
    choices:
      - id: ok5
        text: そのままでよい（8人制は5m）
        feedback: 8人制でも5mではありません。フリーキックのとき、相手競技者はボールから7m以上離れなければなりません。
      - {id: m7, text: 7mまで下げさせる}
      - id: m915
        text: 9.15mまで下げさせる
        feedback: 9.15mは11人制の距離です。8人制のフリーキックとコーナーキックは7mです。
    answer: m7
explain:
  summary: 8人制のフリーキックでは、相手競技者はボールから7m以上離れます（コーナーキックも7m）。
  detail: 攻撃側が{{クイックリスタート}}を選んだ場合は、相手が7m離れていなくても蹴ることができます。主審が距離をとらせて再開を管理したときは、笛の合図で再開します。
  overlays:
