# I-16 旗の持ち方
# 根拠: JFA「審判員のための実践的ガイドライン」2.副審「フラッグテクニック 副審の旗は、常に広げた状態で主審に見えるようにしなければならない。
#       このことは、通常、旗は主審に近い方の手で持つことを意味する。シグナルをするとき、副審は立ち止まり、競技のフィールドに面し、主審を目で確認して、
#       （急がず、過度にならないように）落ち着いて旗を上げなければならない。旗は、伸ばした腕の延長のようになるように上げる。
#       副審は、次のシグナルを示す方の手で旗を上げなければならない。状況が変わり、もう一方の手を使わなければならなくなった場合、副審は腰より低い位置で反対の手に旗を持ち替える」
id: I-16
category: signals
badges: []
review: {status: draft}
title: 旗の持ち方
kind: signal
figure: {pose: ar.rest}
steps:
  - type: choice
    question: 副審が走っているとき、旗はふつう、どちらの手で持つ？
    choices:
      - id: right
        text: いつも右手
        feedback: 決まった手はありません。旗が主審に見えるように、主審に近いほうの手で持ちます。
      - {id: near, text: 主審に近いほうの手}
      - id: far
        text: 主審から遠いほうの手
        feedback: 旗は、いつも広げた状態で主審に見えるようにします。そのため、主審に近いほうの手で持ちます。
    answer: near
  - type: choice
    question: 合図のために、旗を反対の手に持ち替えたい。どうする？
    choices:
      - id: head
        text: 頭の上で持ち替える
        feedback: 頭の上で持ち替えると、合図と間違われます。腰より低い位置で持ち替えます。
      - {id: waist, text: 腰より低い位置で持ち替える}
      - id: back
        text: 背中に回して持ち替える
        feedback: 旗が主審から見えなくなります。腰より低い位置で持ち替えます。
    answer: waist
  - type: choice
    question: 合図をするとき、副審がすることとして正しいものは？
    choices:
      - id: run
        text: 走りながら、すばやく旗を上げる
        feedback: 合図をするときは立ち止まり、急がずに落ち着いて旗を上げます。
      - {id: stop, text: 立ち止まり、フィールドのほうを向き、主審を目で確認して、落ち着いて旗を上げる}
      - id: shout
        text: 大きな声で競技者に判定を伝えてから、旗を上げる
        feedback: 副審は旗で主審に伝えます。合図をするときは立ち止まり、主審を目で確認します。
    answer: stop
explain:
  summary: 旗は、いつも広げた状態で主審に見えるように、主審に近いほうの手で持ちます。持ち替えるときは腰より低い位置で。合図は立ち止まって、主審を目で確認してから落ち着いて出します。
  detail: 旗は、伸ばした腕の延長になるように上げます。合図は、次に示す合図の方向の側の手で上げます（オフサイドとゴールラインを越えたときは右手）。
  overlays: []
