# F-04 補助審判の任務
# 根拠: 8人制「1人制審判を採用した場合の補助審判の役割」（P.5）②補助審判の任務 (1)主審が職務を続行できない場合に主審を務める (2)ボールの交換を管理する (3)必要に応じてベンチを管理する (4)次の場合に主審を援助する
id: F-04
category: officials
badges: []
review: {status: draft}
title: 補助審判の任務
kind: text
hint: 補助審判は、1人制審判のときに必ず置く役です。副審とは任務が違います。
steps:
  - type: choice
    question: 1人制審判の試合の「補助審判」。その任務として、8人制競技規則に書かれていないものはどれ？
    choices:
      - id: ball
        text: ボールの交換を管理する
        note: 任務（2）
        feedback: これは補助審判の任務です。
      - id: bench
        text: 必要に応じて、ベンチを管理する
        note: 任務（3）
        feedback: これは補助審判の任務です。
      - id: flag
        text: タッチライン沿いを動き、旗でオフサイドを知らせる
        note: 任務にない
      - id: sub
        text: 主審が職務を続けられなくなったら、主審を務める
        note: 任務（1）
        feedback: これは補助審判の任務です。
    answer: flag
explain:
  summary: 補助審判の任務は、主審の代行、ボールの交換の管理、ベンチの管理、主審への援助の4つです。旗でオフサイドを知らせるのは副審の任務です。
  detail: 1人制審判（主審1名）を採用した試合では、補助審判1名を必ず指名します。補助審判が主審を援助するのは、警告・退場を与える競技者を間違えているとき、2枚目の警告にも関わらず退場を与えられていないとき、主審の見ていないところで乱暴な行為が行われたとき、です。
  overlays: []
