steps:
  - type: placement
    question: 右サイドで1対1になりそうです。主審はどこに立ちますか？ ピッチをタップして置いてください。
    placement:
      mode: free
      marker: 主審
      target: [46, 30]
      tolerance: 5
      zones:
        - at: [45, 47]
          r: 5
          text: 副審と同じ側（タッチライン寄り）です。副審とでプレーを挟めず、副審も視野に入りにくくなります。
        - at: [51, 43]
          r: 3.5
          text: プレーに近すぎます。競技者のじゃまにならないように、少し離れます。
        - at: [56, 12]
          r: 7
          text: 副審と反対側ですが、ゴールに近すぎて、プレーと副審が同時に見えにくくなります。
        - at: [36, 18]
          r: 6
          text: プレーから遠すぎます。反則を見極められるように、十分に近づきます。
explain:
  summary: 主審は、プレーが行われている側の副審とでプレーを挟むように、プレーの外側（副審と反対側）の斜め後ろに立ちます。プレーと副審の両方が視野に入ります。
  detail: これを「対角線式審判法」と呼びます。主審はプレーのじゃまをしない範囲で、十分にプレーに近づきます。見るべきものはボールの周りだけではありません。ボールから離れたところでの競り合いや、プレーが向かっていく地域にも気を配ります。
  overlays:
    - {type: marker, at: [46, 30], label: 主審の目安}
    - {type: offsideLine, actor: B4, label: 副審のライン（後方から2人目）}
