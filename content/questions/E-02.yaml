# E-02 主審の位置（副審とプレーを挟む）
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング（位置取り）、動き方とチームワーク 1.一般的なポジショニングと動き方「求められるべきポジショニング
#       ・主審とプレーが行われている側の副審でプレーを挟む。
#       ・主審は、通常、幅広い対角線式審判法を用い、プレーが行われている側の副審が自分の視野に入るようにする。
#       ・主審は、プレーの外側に向かって位置することによって、プレーとプレーが行われている側の副審を容易に視野に入れることができる。
#       ・主審は、プレーを妨害することなく、十分にプレーに近づく」
#       ※ガイドラインの図は11人制。8人制のピッチでの正解位置と範囲は監修で決める
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
