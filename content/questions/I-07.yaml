# I-07 間接フリーキックの腕はいつ下ろす？
# 根拠: 第13条 フリーキック「間接フリーキックのシグナル 主審は、片腕を頭上に上げて間接フリーキックであることを示す。
#       キックが行われ、他の競技者がボールに触れる、アウトオブプレーになる、または直接得点することができないと明らかにわかるまで、このシグナルを続ける。
#       フリーキックが間接であることを示すシグナルを主審が怠ったが、ボールがけられて直接ゴールに入った場合、間接フリーキックは、再び行われなければならない」
id: I-07
category: signals
badges: []
review: {status: draft}
title: 間接フリーキックの腕はいつ下ろす？
kind: signal
figure: {pose: ref.indirectFreeKick}
hint: 腕を上げておくのは、「このキックは直接ゴールに入っても得点にならない」と知らせるためです。
steps:
  - type: choice
    question: 間接フリーキックの合図（片腕を頭の上に上げる）は、いつまで続ける？
    choices:
      - id: kick
        text: キックが行われたら、すぐに下ろす
        feedback: キックのあとも続けます。ボールがまだ直接ゴールに入るかもしれないからです。
      - id: whistle
        text: 笛を吹いて再開の合図をしたら下ろす
        feedback: 再開の前に下ろしてしまうと、間接フリーキックだと分かりません。
      - {id: touch, text: ほかの競技者がボールに触れる、ボールが外に出る、または直接得点できないと明らかに分かるまで}
    answer: touch
  - type: choice
    question: 主審が間接フリーキックの合図を忘れた。キックされたボールが、だれにも触れずに直接ゴールに入った。どうする？
    choices:
      - id: goal
        text: 得点を認める
        feedback: 間接フリーキックは、直接ゴールに入っても得点になりません。
      - id: gk
        text: 相手チームのゴールキック
        feedback: 合図をしていれば、ふつうはゴールキックです。ただし合図を怠った場合は、キックのやり直しです。
      - {id: retake, text: 間接フリーキックをやり直す}
    answer: retake
explain:
  summary: 間接フリーキックの合図は、ほかの競技者がボールに触れる、アウトオブプレーになる、または直接得点できないと明らかに分かるまで続けます。合図を怠ってボールが直接ゴールに入ったら、キックをやり直します。
  detail: 合図を続けるのは、キッカーや GK、ほかの審判員に「このキックは直接得点にならない」と知らせるためです。主審が合図を怠ったために競技者が勘違いした場合に備えて、規則で「再び行う」と決められています。
  overlays: []
