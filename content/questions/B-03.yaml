# B-03 GKの交代
# 根拠: 8人制 第3条④ ゴールキーパーの交代の手続き (1)アウトオブプレーになった時に主審に通知し承認を得る (2)退くGKは境界線の最も近い地点から出る (3)入るGKはハーフウェーラインのところから入る（P.4）
id: B-03
category: substitution
levels: [grade4]
badges: []
review: {status: draft}
title: GKの交代
kind: text
steps:
  - type: choice
    question: GKをベンチの選手と交代したい。交代できるのはいつ？
    choices:
      - id: any
        text: フィールドの競技者と同じく、インプレー中でもいつでも
        feedback: 自由な交代（主審の承認不要）は、フィールドの競技者だけです。GKの交代には主審の承認が必要です。
      - id: out
        text: ボールがアウトオブプレーになったときに、主審に知らせて承認を得てから
      - id: half
        text: ハーフタイムのときだけ
        feedback: ハーフタイムに限りません。アウトオブプレーのときに、主審の承認を得れば交代できます。
    answer: out
  - type: choice
    question: 交代して退くGKは、どこからフィールドの外に出る？
    choices:
      - id: zone
        text: 交代ゾーンまで行って、そこから出る
        feedback: 交代ゾーンから出るのは、フィールドの競技者の交代です。退くGKは、境界線の最も近い地点から出ます。
      - id: near
        text: 境界線（タッチラインかゴールライン）の最も近い地点から
      - id: half
        text: ハーフウェーラインのところから
        feedback: ハーフウェーラインのところから入るのは、代わりに入るGKです。
    answer: near
explain:
  summary: GKの交代は、アウトオブプレーのときに主審の承認を得て行います。退くGKは最も近い境界線から出て、入るGKはハーフウェーラインのところから入ります。
  detail: 8人制競技規則 第3条④の規定です。フィールドの競技者の交代（第3条③）は、インプレー中でもアウトオブプレー中でも、主審の承認なしに交代ゾーンから行えますが、GKの交代は手続きが違います。フィールドの競技者とGKの入れ替え（第3条⑤）も、アウトオブプレーのときに主審に通知し、承認を得て行います。
  overlays: []
