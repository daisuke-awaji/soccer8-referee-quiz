# K-01 入場から整列・挨拶まで
# 根拠: 大阪府サッカー協会「初心者のためのレフェリーズマニュアル」試合の進行 P.9（PDF 11ページ）
#       「入場 ①フィールド内に入り、タッチラインから５～６メートル程度のところに、主審・副審（第4の審判）を中心に
#        両チームが両側に横一列に並び、スタンドの観衆に挨拶する」
#       関西学生サッカー連盟「審判活動のガイドライン」試合の進行（1）入場「①審判が先導し、両チームはその後ろへ２列に並ぶ」
#       「２）あるいは、そのままセンターサークル内に入って、両チーム向かい合って挨拶を交わす」
#       世田谷少年サッカー連盟「審判基本マニュアル」【試合開始前】（ベンチまで引率 → 先発選手をセンターサークルまで誘導）
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
