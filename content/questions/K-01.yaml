steps:
  - type: choice
    question: このあと、両チームと審判員はどのように並びますか？
    choices:
      - {id: center, text: 主審・副審を中心に、両チームがその両側に横一列に並ぶ}
      - id: outside
        text: 両チームだけが横一列に並び、審判員はタッチラインの外で見守る
        feedback: 審判員も一緒に並びます。主審・副審が真ん中に入り、両チームはその両側に並びます。
      - id: end
        text: 両チームが続けて1列に並び、審判員は列の端に立つ
        feedback: 審判員は列の端ではなく、真ん中に並びます。両チームは審判員をはさんで、左右に分かれます。
    answer: center
explain:
  summary: 入場したら、タッチラインから5〜6mのところで、主審・副審を中心に両チームが両側に横一列に並び、挨拶します。
  detail: |-
    試合前から挨拶までの流れの一例です（大阪府サッカー協会のマニュアルなど）。
    ① 入場の前に、メンバー表の番号と名前、用具（すね当て・靴・シャツ・不要な装身具がないか）を確かめる。
    ② 審判員が先頭に立ち、両チームはその後ろに2列で並んで入場する。
    ③ タッチラインから5〜6mのところで止まり、主審・副審を中心に、両チームが両側に横一列に並ぶ。
    ④ 本部・観客の側を向いて挨拶する。
    ⑤ 片方のチームが移動して、審判員と相手チームと握手する（K-02）。
    ⑥ 主審が両チームのキャプテンを呼び、コイントスをする（K-03）。
    並ぶ場所は大会によって違います。センターサークルまで進み、両チームが向かい合って挨拶する方法もあります。大会の決まりや、地域の協会の指示に従いましょう。
  overlays: []
