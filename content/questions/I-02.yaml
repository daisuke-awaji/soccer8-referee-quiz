# I-02 アドバンテージの合図
# 根拠: 第5条 主審「6. 主審のシグナル」の図（アドバンテージ(1)(2)）
#       第5条 主審「アドバンテージ 反則があり、反則を行っていないチームがアドバンテージによって利益を受けそうなときは、プレーを継続させる。
#       しかし、予期したアドバンテージがそのとき、または数秒以内に実現しなかった場合、その反則を罰する」
id: I-02
category: signals
badges: []
review: {status: draft, note: 絵は第5条の図「アドバンテージ」をもとに簡略化した。監修で確認する}
title: アドバンテージの合図
kind: signal
steps:
  - type: choice
    question: 反則があったが、反則を受けたチームがそのまま攻撃を続けたほうが有利。主審がプレーを続けさせる「アドバンテージ」の合図はどれ？
    choices:
      - id: ifk
        text: 片腕を真上に上げる
        figure: {pose: ref.indirectFreeKick}
        feedback: これは間接フリーキックの合図です。プレーを止めたあとに出します。
      - id: adv
        text: 両腕を前に伸ばす
        figure: {pose: ref.advantage, right: 攻める方向}
      - id: dfk
        text: 片腕を横に伸ばして指す
        figure: {pose: ref.directFreeKick}
        feedback: これは直接フリーキックの合図です。プレーを止めたあとに出します。
      - id: cd
        text: 片手を上げて指を開く
        figure: {pose: ref.countdown}
        feedback: これは、GKがボールを手で持てる8秒の、残り5秒のカウントダウンです。
    answer: adv
  - type: choice
    question: アドバンテージの合図をしたが、数秒たっても、反則を受けたチームに有利な展開にならなかった。主審は？
    choices:
      - id: go
        text: 一度アドバンテージを示したので、そのままプレーを続ける
        feedback: 予期したアドバンテージが、そのとき、または数秒以内に実現しなかった場合は、元の反則を罰します。
      - {id: back, text: 元の反則を罰する（プレーを止めて、反則のフリーキックなどで再開）}
      - id: db
        text: プレーを止めて、ドロップボールで再開する
        feedback: ドロップボールではありません。元の反則に対するフリーキックなどで再開します。
    answer: back
explain:
  summary: アドバンテージの合図は、腕を前（攻める方向）に伸ばします。数秒以内に有利にならなければ、元の反則を罰します。
  detail: 反則があり、反則を受けたチームがアドバンテージによって利益を受けそうなときは、主審はプレーを続けさせます。しかし、予期したアドバンテージが、そのとき、または数秒以内に実現しなかった場合は、その反則を罰します。
  overlays: []
refs:
  - {src: laws, article: 第5条 主審 6.主審のシグナル（アドバンテージ）}
  - {src: laws, article: 第5条 主審 3.権限および任務（アドバンテージ）}
