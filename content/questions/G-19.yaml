# G-19 GKと手の○×
# 根拠: 第12条1（GKはPA外では他の競技者と同様に制限される。PA内で認められずに手で扱っても懲戒なし）
#       第12条2（味方が意図的にキックしたボール／味方のスローインを直接受けたボール）
id: G-19
category: foul
badges: []
review: {status: draft}
title: GKと手の○×
kind: text
hint: GKが手で扱えないボールは、2種類だけです。
steps:
  - type: choice
    question: 正しい？ 誤り？ ——「GKも、自分のペナルティーエリアの外では、手でボールを扱えない」
    choices:
      - {id: o, text: 正しい}
      - id: x
        text: 誤り
        feedback: ペナルティーエリアの外では、GKもほかの競技者と同じです。手で扱えばハンドの反則（直接FK）です。
    answer: o
  - type: choice
    question: 正しい？ 誤り？ ——「バックパスを手で扱ったGKには、警告を与える」
    choices:
      - id: o
        text: 正しい
        feedback: 懲戒の罰則は与えられません。相手チームの間接FKで再開するだけです。
      - {id: x, text: 誤り}
    answer: x
  - type: choice
    question: 正しい？ 誤り？ ——「味方が胸で返したボールは、GKが手で取ってよい」
    choices:
      - {id: o, text: 正しい}
      - id: x
        text: 誤り
        feedback: 手で扱えないのは、味方が意図的に足でけったボールと、味方のスローインを直接受けたボールです。胸や頭で返したボールは手で扱えます（規則の裏をかくトリックは除く）。
    answer: o
  - type: choice
    question: 正しい？ 誤り？ ——「GKは、相手チームのスローインのボールなら、手で取ってよい」
    choices:
      - {id: o, text: 正しい}
      - id: x
        text: 誤り
        feedback: 制限されているのは、味方がスローインしたボールを直接受けたときです。
    answer: o
explain:
  summary: GKが自分のペナルティーエリアの中で手で扱えないのは、①味方が意図的に足でけったボール、②味方のスローインを直接受けたボール、の2つです。違反すると相手チームの{{間接フリーキック}}で、懲戒はありません。
  detail: ペナルティーエリアの外では、GKもほかの競技者と同じで、手で扱えばハンドの反則（直接FK）です。味方が頭や胸、膝で返したボールは手で扱えますが、規則の裏をかくために、わざと足でボールを浮かせて頭でGKに返すようなトリックは、警告と間接FKです。
  overlays: []
refs:
  - {src: laws, article: 第12条 ファウルと不正行為 1.直接フリーキック／2.間接フリーキック}
