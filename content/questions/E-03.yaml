steps:
  - type: placement
    question: 右側の副審を、タッチラインの外に沿ってドラッグ（またはタップ）して、コーナーキックのときの正しい位置に動かしてください。
    placement:
      mode: line
      actor: AR2
      fixedY: 51.4
      min: 42.5
      max: 70.5
      target: [68, 51.4]
      tolerance: 1.2
      describe: {kind: lineOffset}
      zones:
        - lineX: 62
          r: 2.5
          text: そこは後方から2人目の守備側競技者のあたりです。コーナーキックでは、ボールが置かれたコーナーエリアとゴールラインを見られる位置に移ります。
        - lineX: 70
          r: 0.8
          text: ゴールラインより後ろに下がりすぎです。ゴールラインの延長上に立ちます。
explain:
  summary: コーナーキックのときの副審は、ゴールラインの延長上で、コーナーフラッグの後方に立ちます。キッカーのじゃまにならないようにします。
  detail: この位置から、ボールがコーナーエリアに正しく置かれているかと、ボールがゴールラインを越えるかどうか（得点・ゴールキック）を見ます。8人制では、コーナーキックのときも相手競技者はボールから7m以上離れます。
  overlays:
    - {type: marker, at: [68, 51.4], label: ゴールラインの延長上}
