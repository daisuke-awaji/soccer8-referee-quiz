# E-03 コーナーキックのときの副審の位置
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング 2.ポジショニングとチームワーク「コーナーキック
#       コーナーキックのときの副審のポジションは、ゴールラインの延長上でコーナーフラッグの後方であるが、コーナーキックを行う競技者を妨害してはならない。
#       また、コーナーエリア内にボールが正しく置かれているかチェックしなければならない」
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
