# K-04 トスに勝ったチームが決めること
# 根拠: 競技規則 第8条 1. キックオフ 進め方
#       「主審がコインをトスし、トスに勝ったチームが、前半にどちらのゴールを攻めるのか、またはキックオフを行うのかを決める」
#       「この結果により、相手チームがキックオフを行うのか、または前半にどちらのゴールを攻めるのかを決める」
#       8人制競技規則には、コイントスについての修正はない
id: K-04
category: matchStart
badges: []
review: {status: draft}
title: トスに勝ったチームが決めること
kind: text
hint: 決められるのは2つのうちの「どちらか」です。
steps:
  - type: choice
    question: コイントスに勝ったチームが決めることは？
    choices:
      - {id: either, text: 前半に攻めるゴールか、キックオフを行うかの、どちらか}
      - id: both
        text: 前半に攻めるゴールと、キックオフを行うかの、両方
        feedback: 勝ったチームが決めるのは、どちらか一方です。残りのもう一方は、相手チームが決めます。
      - id: ko
        text: キックオフを行うかどうかだけ（攻めるゴールは主審が決める）
        feedback: 前半に攻めるゴールを選ぶこともできます。攻めるゴールを主審が決めることはありません。
      - id: whole
        text: 前半と後半の両方で攻めるゴール
        feedback: 後半は、両チームがエンドを替えて反対のゴールを攻めます。決めるのは前半のことだけです。
    answer: either
explain:
  summary: 勝ったチームは「前半に攻めるゴール」か「キックオフ」の、どちらかを決めます。もう一方は相手チームが決めます。
  detail: 競技規則 第8条の規定です。たとえば勝ったチームが攻めるゴールを選んだら、相手チームが前半のキックオフを行います。勝ったチームがキックオフを選んだら、相手チームが前半に攻めるゴールを決めます。8人制競技規則には、コイントスについての修正はありません。
  overlays: []
refs:
  - {src: laws, article: 第8条 プレーの開始および再開 1. キックオフ 進め方}
