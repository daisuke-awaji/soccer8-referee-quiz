# E-09 GKがボールを手で持ったときの副審の位置
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング 2.「ゴールキーパーがボールを放す時 副審は、ペナルティーエリアの端のところにポジションを取り、
#       ゴールキーパーがペナルティーエリアの外でボールを手で触れていないかどうかチェックしなければならない。
#       ゴールキーパーがボールを放したら、オフサイドラインのチェックができるポジションを取らなければならない」
#       （バックログでは 3D の H-05 として挙げていた問題を、2D の配置問題にした）
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
