          text: そこはGK（ボール）のラインです。GKがボールを持っている間は、GKがペナルティーエリアの外で手を使わないかを見るため、ペナルティーエリアの端に立ちます。
        - lineX: 64
          r: 1.2
          text: そこはゴールエリアのラインです。GKがボールを持っているときは、ペナルティーエリアの端に立ちます。
explain:
  summary: GKがボールを手で持っている間、副審はペナルティーエリアの端に立ち、GKがペナルティーエリアの外でボールを手で扱わないかを見ます。
  detail: GKがボールを放したら、オフサイドラインをチェックできる位置（{{後方から2人目の守備側競技者}}のライン）に移ります。8人制のペナルティーエリアは、ゴールラインから12mです。
