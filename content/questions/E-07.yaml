steps:
  - type: placement
    question: 右側の副審を、タッチライン沿いにドラッグ（またはタップ）して、このフリーキックのときの正しい位置に動かしてください。
    placement:
      mode: line
      actor: AR2
      fixedY: 51.4
      min: 34.5
      max: 68
      target: [59.5, 51.4]
      tolerance: 1.5
      describe: {kind: lineOffset}
      zones:
        - lineX: 56
          r: 1
          text: そこは壁のラインです。壁より後ろにも守備側の競技者がいます。GKを含めて、後方から2人目を探しましょう。
        - lineX: 49.5
          r: 2
          text: そこはボールのラインです。ボールより前に守備側の競技者がいるので、後方から2人目の守備側競技者に合わせます。
        - lineX: 66.5
          r: 1.5
          text: そこはGK（最後尾）のラインです。基準は「後方から2人目」です。
explain:
  summary: フリーキックのときの副審は、オフサイドラインをチェックするため、{{後方から2人目の守備側競技者}}のラインに立ちます。ここでは青4番です。
  detail: 最後尾はGK（青1番）、後方から2人目は青4番です。シュートが直接ゴールに向かうときは、ボールを追いかけて、タッチラインに沿ってコーナーフラッグのほうへ動く用意をしておきます。
  overlays:
