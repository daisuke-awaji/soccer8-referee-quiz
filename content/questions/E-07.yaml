# E-07 ゴール前のフリーキックのときの副審の位置
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング 2.「フリーキック フリーキックのときの副審は、オフサイドラインのチェックをするため、後方から2人目の守備側競技者のラインに位置しなければならない。
#       しかしながら、シュートが直接ゴールに放たれる場合、ボールを追いかけタッチラインに沿ってコーナーフラッグ方向に動く用意をしておかなければならない」
#       8人制 第13条 フリーキック（相手競技者はボールから7m以上離れる）
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
