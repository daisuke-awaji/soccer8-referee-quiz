# G-11 2枚目の警告
# 根拠: サッカー競技規則 第12条（同じ試合で2つ目の警告を受けた競技者は退場）／8人制 第12条 退場を命じられた場合、競技者を補充できる（P.4）
id: G-11
category: foul
levels: [grade4]
badges: []
review: {status: draft}
title: 2枚目の警告
kind: text
steps:
  - type: choice
    question: 同じ試合で、2枚目の警告（イエローカード）を受けた競技者がいます。8人制では、どうなる？
    choices:
      - id: stay
        text: 8人制では退場にならず、そのままプレーを続ける
        feedback: 8人制で修正されていない部分には、11人制の規則が適用されます。2枚目の警告は退場です。
      - id: seven
        text: 退場。そのチームは7人で試合を続ける
        feedback: 退場は正しいですが、8人制では競技者を補充できます。
      - id: refill
        text: 退場。そのチームは、ほかの競技者を補充できる
    answer: refill
explain:
  summary: 2枚目の警告を受けた競技者は退場です。8人制では、そのチームは競技者を補充できます。
  detail: 2つ目の警告で退場になるのは、サッカー競技規則 第12条の規定で、8人制でも同じです（8人制競技規則で修正されていない部分は、11人制の規定が適用されます）。8人制競技規則 第12条により、退場を命じられた競技者のチームは、フィールドでプレーする競技者を補充できます。1人制審判では、2枚目の警告なのに退場が与えられていないとき、補助審判が主審を援助します。
  overlays: []
