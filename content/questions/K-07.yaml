explain:
  summary: 主審は、競技者の人数・副審の位置・時計を確かめてから、キックオフの笛を吹きます。監督に許可をもらう必要はありません。
  detail: 世田谷少年サッカー連盟のマニュアルでは、主審は「選手の人数、副審（第4の審判員）の位置、時計」を確かめてから、笛で開始の合図をするとしています。関西学生サッカー連盟のガイドラインでは、主審は笛の前に副審に、両チームが正しい位置にいるかを確かめ、副審は何か異常があれば旗を真上に上げる、としています。キックオフの合図をするのは主審です（第8条）。
  overlays:
    - {type: sightLine, from: REF, to: AR1}
    - {type: sightLine, from: REF, to: AR2}
