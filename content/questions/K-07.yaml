steps:
  - type: choice
    question: キックオフの笛を吹く前に、主審が確かめることとして「誤っている」ものは？
    choices:
      - {id: coach, text: 両チームの監督に、試合を始めてよいかをたずねる}
      - id: count
        text: 両チームの競技者の人数がそろっていること
        feedback: これは笛の前に確かめることです。8人制では、どちらかのチームが6人未満なら試合を始めません。
      - id: ar
        text: 副審が位置について、準備ができていること
        feedback: これは笛の前に確かめることです。主審は笛の前に、副審の準備ができているかを確かめます。
      - id: watch
        text: 時計（試合時間を計る準備）
