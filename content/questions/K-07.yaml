# K-07 キックオフの笛の前に
# 根拠: 世田谷少年サッカー連盟「審判基本マニュアル」【試合】「主審は選手の人数。副審・第4審判の位置。時計を確認した後、開始の合図を笛で行い、試合を開始する」
#       関西学生サッカー連盟「審判活動のガイドライン」（3）キックオフ「①主審は両チームが…所定の位置にいることを確認する。
#       ②主審は、笛を吹く前に副審１、副審２に、守備チーム、攻撃チームが、正規のポジションにいることを確かめる。
#       （副審は、何か異常を認めたときは、旗を真上に上げる）③キックオフの笛を吹く」
#       競技規則 第8条「主審が合図する」
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
