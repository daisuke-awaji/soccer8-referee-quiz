# I-04 旗を斜め上に上げた（スローイン）
# 根拠: 第6条 その他の審判員「6. 副審のシグナル」の図（攻撃側チームのスローイン／守備側チームのスローイン）
#       JFA「審判員のための実践的ガイドライン」2.副審「フラッグテクニック」「副審は、次のシグナルを示す方の手で旗を上げなければならない」
#       「スローイン ボールの全体がタッチラインを越えた場合、副審に近いとき－直接スローインの方向を示すべきである。
#       副審から遠く、スローインの方向が副審から不確かなとき－副審は旗を上げて主審にボールがアウトオブプレーになったことを伝え、主審を目で確認して主審のシグナルに合わせなければならない」
id: I-04
category: signals
badges: []
review: {status: draft}
title: 旗を斜め上に上げた
kind: signal
figure: {pose: ar.direction, left: 青チームが攻める方向, right: 赤チームが攻める方向}
hint: 旗が向いている方向に注目しましょう。
steps:
  - type: choice
    question: 副審の近くで、ボールがタッチラインを越えた。副審は旗を斜め上に上げて、この合図をしました。どちらのチームのスローイン？
    choices:
      - {id: red, text: 赤チーム}
      - id: blue
        text: 青チーム
        feedback: 旗は、スローインを行うチームが攻める方向に向けます。旗が向いているのは赤チームが攻める方向です。
      - id: none
        text: この合図だけでは分からない
        feedback: 旗の向きで分かります。旗は、スローインを行うチームが攻める方向に向けます。
    answer: red
  - type: choice
    question: 副審から遠いところでボールがタッチラインを越え、どちらが最後に触れたか、副審にははっきり分からなかった。副審は？
    choices:
      - id: guess
        text: 攻めているチームの方向に旗を向ける
        feedback: 分からないまま方向を示してはいけません。主審と合図が食い違うと、競技者が混乱します。
      - {id: up, text: 旗を上げてボールが出たことを伝え、主審を目で確認して、主審の合図に合わせる}
      - id: none
        text: 何もしないで、主審に任せる
        feedback: ボールが出たことは、旗を上げて主審に伝えます。そのうえで、方向は主審の合図に合わせます。
    answer: up
explain:
  summary: 副審のスローインの合図は、旗を斜め上に上げて、スローインを行うチームが攻める方向を指します。方向がはっきり分からないときは、旗を上げてボールが出たことだけを伝え、主審の合図に合わせます。
  detail: 副審は、合図で示す方向の側の手で旗を上げます。合図をするときは立ち止まり、フィールドのほうを向き、主審を目で確認してから、落ち着いて旗を上げます。旗は、伸ばした腕の延長になるように上げます。
  overlays: []
