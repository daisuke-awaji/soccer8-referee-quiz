# K-05 前半と後半のキックオフ
# 根拠: 競技規則 第8条 1. キックオフ 進め方
#       「トスに勝ったチームが、前半にどちらのゴールを攻めるのか、またはキックオフを行うのかを決める」
#       「この結果により、相手チームがキックオフを行うのか、または前半にどちらのゴールを攻めるのかを決める」
#       「前半にどちらのゴールを攻めるのかを決めたチームは、後半開始のキックオフを行う」
#       「試合の後半には、両チームは、エンドを替え、反対のゴールを攻める」
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
