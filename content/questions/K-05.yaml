steps:
  - type: choice
    question: 赤チームがトスに勝ち、前半に攻めるゴールを選びました。前半のキックオフをするのは？
    choices:
      - {id: blue, text: 青チーム}
      - id: red
        text: 赤チーム
        feedback: 赤チームはゴールを選んだので、キックオフは相手の青チームが行います。勝ったチームが決めるのは、ゴールかキックオフの「どちらか」です。
      - id: toss
        text: もう一度コイントスをして決める
        feedback: トスは1回だけです。勝ったチームが選ばなかったほうを、相手チームが受け持ちます。
    answer: blue
  - type: choice
    question: では、後半開始のキックオフは？
    choices:
      - {id: redswap, text: 赤チームがキックオフする。両チームはエンドを替える}
      - id: blueswap
        text: 青チームが続けてキックオフする。両チームはエンドを替える
        feedback: 後半開始のキックオフは、前半に攻めるゴールを選んだチーム（赤）が行います。
      - id: redstay
        text: 赤チームがキックオフする。エンドは前半のまま
        feedback: 後半は、両チームがエンドを替えて反対のゴールを攻めます。
    answer: redswap
explain:
  summary: ゴールを選んだのが赤なら、前半のキックオフは青です。後半は{{エンド}}を替えて、ゴールを選んだ赤がキックオフします。
  detail: 第8条では「前半にどちらのゴールを攻めるのかを決めたチームは、後半開始のキックオフを行う」と決められています。前半と後半で、両チームが1回ずつキックオフをすることになります。キックオフのあと、得点が入った場合は、得点されたチームがキックオフします。
  overlays: []
