# K-06 キックオフとエンドの○×
# 根拠: 競技規則 第8条 1. キックオフ 進め方
#       「試合の後半には、両チームは、エンドを替え、反対のゴールを攻める」
#       「一方のチームが得点したのち、他方のチームがキックオフを行う」
#       「主審がコインをトスし」
#       大阪府サッカー協会「初心者のためのレフェリーズマニュアル」審判の用具「⑧トス用のコインは裏表がわかるものであれば何でもよい」
#       関西学生サッカー連盟「審判活動のガイドライン」持ち物「トスコイン（表裏がはっきりとすれば何でも良い）」
