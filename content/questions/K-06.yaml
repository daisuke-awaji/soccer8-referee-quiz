explain:
  summary: 後半はエンドを替えます。得点のあとは、得点されたチームがキックオフします。トスは主審が行い、コインは表と裏がわかれば何でもかまいません。
  detail: 第8条では、前半に攻めるゴールを選んだチームが、後半開始のキックオフを行うことも決まっています（K-05）。コインについては競技規則に決まりはありません。大阪府サッカー協会のマニュアルなどでは、表と裏がわかるものなら何でもよいとしています。
  overlays: []
