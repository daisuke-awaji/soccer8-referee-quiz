steps:
  - type: choice
    question: 8人制の試合で、競技者が退場を命じられました。そのチームはどうなる？
    choices:
      - id: refill
        text: ほかの競技者を補充して、8人で続けられる
      - id: seven
        text: 7人で試合を続ける（補充はできない）
        feedback: それは11人制のルールです。8人制では、退場があっても競技者を補充できます。
      - id: forfeit
        text: そのチームの負けになる
