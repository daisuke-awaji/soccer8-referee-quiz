explain:
  summary: 8人制では、競技者が退場を命じられても、そのチームは競技者を補充できます。
  detail: 8人制競技規則 第12条の規定です。11人制では、退場を命じられた競技者の分を補充することはできません。8人制では、退場を命じられた競技者の代わりに、ほかの競技者がフィールドに入ってプレーできます。
