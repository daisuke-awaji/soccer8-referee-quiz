# E-04 ペナルティーキックのときの副審の位置
# 根拠: JFA「審判員のための実践的ガイドライン」ポジショニング 2.「ペナルティーキック 副審は、ゴールラインとペナルティーエリアラインの交点のところに位置しなければならない。
#       ただし、追加副審がいる場合、追加副審はゴールラインとゴールエリアの交点のところに位置しなければならない。副審は、ペナルティーマークのライン（オフサイドライン）に位置する」
#       「ペナルティーマークからのキック 副審の1人はゴールラインとゴールエリアラインの交点に位置しなければならない」
#       第6条「副審は…ペナルティーキックのとき、ボールがけられる前にゴールキーパーがゴールラインを離れたかどうか、またボールがゴールラインを越えたかどうか（合図をする）」
# 座標: x=0〜68m（赤は x=68 の青ゴールへ攻撃）, y=0〜50m（y=0 がベンチ側）, 時間は秒
