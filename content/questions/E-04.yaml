        - at: [60, 50]
          r: 3
          text: そこはペナルティーマークのライン（オフサイドライン）です。追加副審がいるときの副審の位置です。
        - at: [68, 50]
          r: 2.5
          text: そこはコーナーフラッグのあたりです。ペナルティーキックでは、ゴールラインとペナルティーエリアのラインが交わるところに立ちます。
explain:
  summary: ペナルティーキックのときの副審は、ゴールラインとペナルティーエリアのラインが交わるところに立ちます。
  detail: ここから、ボールがけられる前にGKがゴールラインを離れないか、ボールがゴールラインを越えたか（得点か）を見ます。8人制のペナルティーエリアは、ゴールポストの内側から12mです。
  overlays:
    - {type: marker, at: [68, 39.5], label: ゴールラインとPAのラインの交点}
