steps:
  - type: choice
    question: 3人制審判の試合で、ベンチの間に座っている「第4の審判員」。その任務として正しくないものはどれ？
    choices:
      - id: sub
        text: 交代の手続きを管理する
        note: ○ 第4の審判員の任務
        feedback: これは第4の審判員の任務です。
      - id: equip
        text: 競技者と交代要員の用具を点検する
        note: ○ 第4の審判員の任務
        feedback: これは第4の審判員の任務です。
      - id: time
        text: アディショナルタイムを表示する
        note: ○ 第4の審判員の任務
        feedback: これは第4の審判員の任務です。主審が決めた最小限の時間を表示します。
      - id: whistle
        text: 自分の判断で笛を吹き、プレーを止める
        note: × 任務ではない（判定を下すのは主審）
    answer: whistle
  - type: choice
    levels:
      - grade4
    question: （4級）1人制審判の試合で、ベンチ横の補助審判。主審が警告する選手を間違えました。補助審判はどうしますか？
    choices:
      - {id: tell, text: すぐに主審に知らせて援助する}
      - id: card
        text: 自分で正しい選手にカードを示す
        feedback: 補助審判はカードを示しません。判定を下すのは主審です。
      - id: after
        text: 試合後に報告するだけにする
        feedback: 人違いは、試合中に主審に知らせて援助する任務です。
    answer: tell
explain:
  summary: "{{第4の審判員}}は主審を援助する役で、最終決定は常に主審が下します。"
  detail: 第4の審判員の主な任務：交代の手続きの管理／競技者と交代要員の用具の点検／主審の合図を受けた後の競技者の再入場／ボール交換の管理／アディショナルタイムの表示／テクニカルエリアで責任ある行動をとらなかった人について主審に伝える。8人制の3人制審判では、第4の審判員は任意です。1人制審判では{{補助審判}}が必須で、人違いの警告、2枚目の警告なのに退場が命じられていない、主審が見ていない乱暴な行為などのときに主審を援助します。
  overlays: []
