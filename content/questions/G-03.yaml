      - id: rc
        text: 決定的な得点の機会の阻止で退場させる
        feedback: 自分のペナルティーエリアの中でGKが手で扱った場合は、ハンドによる得点の機会の阻止（退場）の対象から除かれています。
    answer: none
  - type: choice
    question: 間接フリーキックは、どこから行いますか？
    choices:
      - {id: spot, text: GKが手でボールに触れた地点}
      - id: pass
        text: 青4番がパスを出した地点
        feedback: 反則は「GKが手で触れたこと」です。フリーキックは反則の起きた場所から行います。
      - id: pkmark
        text: ペナルティーマーク
        feedback: PKではないので、ペナルティーマークからは行いません。
    answer: spot
explain:
  summary: 味方が意図的に足でけってGKに渡したボール（{{バックパス}}）を、GKが自分のペナルティーエリアの中で手で扱うと、相手チームの{{間接フリーキック}}です。懲戒はありません。
  detail: フリーキックは反則の起きた場所（GKが手で触れた地点）から行います。8人制では、相手競技者はボールから7m以上離れます（自分のゴールポストの間のゴールライン上に立つ場合を除く）。主審は、けられたボールがほかの競技者に触れるか、アウトオブプレーになるまで片腕を上げ続けます。なお、ペナルティーエリアの外でGKが手で扱えば、ほかの競技者と同じハンドの反則（直接FK）です。
  overlays:
    - {type: zone, x1: 56, x2: 68, y1: 10.5, y2: 39.5, label: ペナルティーエリア}
    - {type: marker, at: [63.4, 23.9]}
