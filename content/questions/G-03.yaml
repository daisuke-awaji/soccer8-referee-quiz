steps:
  - type: choice
    question: 味方が足でけって返したボールを、GKが手で取りました。どう判定しますか？
    choices:
      - id: play
        text: 反則ではない。プレーを続ける
        feedback: 味方が意図的に足でけってGKに渡したボールは、GKが自分のペナルティーエリアの中でも手で扱えません。
      - {id: ifk, text: 赤チームの間接フリーキック}
      - id: dfk
        text: 赤チームの直接フリーキック
        feedback: ハンドの反則（直接FK）ではありません。GKが自分のペナルティーエリアの中で手で扱う反則は、間接FKです。
      - id: pk
        text: 赤チームのペナルティーキック
        feedback: ペナルティーエリアの中で起きても、PKにはなりません。間接FKです。
    answer: ifk
  - type: choice
    question: GK（青1番）に、警告などの懲戒は必要ですか？
